<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Editor - Pet Catching RPG</title>
    <style>
        :root {
            --bg0: #000814; 
            --bg1: #001d3d; 
            --bg2: #003566;
            --p0: #0077b6; 
            --p1: #90e0ef; 
            --w: #caf0f8;
            --r: 8px;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg0);
            color: var(--w);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--p1); margin-bottom: 10px; }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--bg1);
            padding: 15px;
            border-radius: var(--r);
            border: 2px solid var(--p0);
            flex-wrap: wrap;
            justify-content: center;
        }

        .brush-btn {
            background: var(--bg2);
            color: white;
            border: 2px solid transparent;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .brush-btn:hover { filter: brightness(1.2); }
        .brush-btn.active { border-color: var(--p1); box-shadow: 0 0 10px var(--p0); }

        /* Brush Colors */
        .brush-grass { background: #27ae60; }
        .brush-tall_grass { background: #1e8449; }
        .brush-wall { background: #4a5568; }
        .brush-water { background: #3498db; }
        .brush-planks { background: #8b5a2b; }
        .brush-route { background: #f1c40f; color: black; }
        .brush-gate_next { background: #d35400; }
        .brush-gate_prev { background: #c0392b; }

        .editor-container {
            display: grid;
            grid-template-columns: repeat(30, 20px);
            grid-template-rows: repeat(30, 20px);
            gap: 1px;
            background: #000;
            border: 4px solid var(--p0);
            user-select: none;
        }

        .cell {
            width: 20px;
            height: 20px;
            cursor: crosshair;
        }

        /* Tile visuals matching game specifications[cite: 3] */
        .cell.grass { background: #27ae60; }
        .cell.tall_grass { background: #1e8449; }
        .cell.wall { background: #4a5568; }
        .cell.water { background: #3498db; }
        .cell.planks { background: #8b5a2b; }
        .cell.route { background: #f1c40f; }
        
        .cell.gate_next { 
            background: #d35400; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
        }
        .cell.gate_next::after { content: "➡️"; }

        .cell.gate_prev { 
            background: #c0392b; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
        }
        .cell.gate_prev::after { content: "⬅️"; }

        .action-row {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 630px;
        }

        .btn-ready {
            flex: 1;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px;
            border-radius: var(--r);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-ready:hover { background: #27ae60; }
        .btn-clear { background: #e74c3c; color: white; border: none; padding: 15px; border-radius: var(--r); font-weight: bold; cursor: pointer; }
        .btn-clear:hover { background: #c0392b; }

        .output-container {
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
            display: none;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: #111;
            color: #2ecc71;
            border: 2px solid var(--p0);
            border-radius: var(--r);
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
    </style>
</head>
<body>

    <h1>RPG Map Editor</h1>
    
    <div class="toolbar" id="toolbar">
        <button class="brush-btn brush-grass active" onclick="setBrush('grass')">Grass</button>
        <button class="brush-btn brush-tall_grass" onclick="setBrush('tall_grass')">Tall Grass</button>
        <button class="brush-btn brush-wall" onclick="setBrush('wall')">Wall</button>
        <button class="brush-btn brush-water" onclick="setBrush('water')">Water</button>
        <button class="brush-btn brush-planks" onclick="setBrush('planks')">Planks</button>
        <button class="brush-btn brush-route" onclick="setBrush('route')">Route</button>
        <button class="brush-btn brush-gate_next" onclick="setBrush('gate_next')">Next Gate</button>
        <button class="brush-btn brush-gate_prev" onclick="setBrush('gate_prev')">Prev Gate</button>
    </div>

    <div class="editor-container" id="editorContainer"></div>

    <div class="action-row">
        <button class="btn-ready" onclick="generateMapCode()">Generate Map Code</button>
        <button class="btn-clear" onclick="clearMap()">Clear Map</button>
    </div>

    <div class="output-container" id="outputContainer">
        <h3>Generated Map Array</h3>
        <textarea id="outputCode" readonly></textarea>
    </div>

    <script>
        const MAP_SIZE = 30;
        let currentBrush = 'grass';
        let isMouseDown = false;
        let mapData = Array(MAP_SIZE).fill().map(() => Array(MAP_SIZE).fill('grass'));

        const editorContainer = document.getElementById('editorContainer');

        function initEditor() {
            editorContainer.innerHTML = '';
            for (let r = 0; r < MAP_SIZE; r++) {
                for (let c = 0; c < MAP_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${mapData[r][c]}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    cell.addEventListener('mousedown', (e) => {
                        isMouseDown = true;
                        paintCell(r, c);
                    });

                    cell.addEventListener('mouseover', (e) => {
                        if (isMouseDown) paintCell(r, c);
                    });

                    editorContainer.appendChild(cell);
                }
            }
        }

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        function setBrush(brushType) {
            currentBrush = brushType;
            document.querySelectorAll('.brush-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function paintCell(r, c) {
            mapData[r][c] = currentBrush;
            const cell = editorContainer.children[r * MAP_SIZE + c];
            cell.className = `cell ${currentBrush}`;
        }

        function clearMap() {
            if (confirm("Are you sure you want to clear the map?")) {
                mapData = Array(MAP_SIZE).fill().map(() => Array(MAP_SIZE).fill('grass'));
                initEditor();
                document.getElementById('outputContainer').style.display = 'none';
            }
        }

        function generateMapCode() {
            let output = "[\n";
            for (let r = 0; r < MAP_SIZE; r++) {
                output += "    [\"" + mapData[r].join("\", \"") + "\"]";
                if (r < MAP_SIZE - 1) output += ",";
                output += "\n";
            }
            output += "]";
            
            document.getElementById('outputCode').value = output;
            document.getElementById('outputContainer').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', initEditor);
    </script>
</body>
</html>
