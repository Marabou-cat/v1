<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Brawl - Online Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Titan+One&family=Lilita+One&display=swap');

        :root {
            --bs-yellow: #ffcc00;
            --bs-yellow-shadow: #b38f00;
            --bs-blue: #0088ff;
            --bs-blue-dark: #0055b3;
            --bs-green: #28d700;
            --bs-green-shadow: #1b8a00;
            --bs-purple: #9d00ff;
            --bs-red: #ff2255;
            --bs-dark: #121624;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: radial-gradient(circle, #252e4a 0%, #0c0f1d 100%);
            font-family: 'Lilita One', cursive, sans-serif;
            color: white;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* TOP HUD BAR */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0,0,0,0.4);
            border-bottom: 4px solid #1e263c;
        }

        .profile-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1e263d;
            padding: 6px 18px 6px 8px;
            border-radius: 50px;
            border: 3px solid #3b486b;
            box-shadow: 0 4px 0 #0f131f;
        }

        .profile-avatar {
            width: 45px;
            height: 45px;
            background: var(--bs-yellow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            border: 3px solid white;
        }

        .currency-container {
            display: flex;
            gap: 15px;
        }

        .currency-pill {
            background: #131726;
            border: 3px solid #2d3859;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1.1rem;
            color: var(--bs-yellow);
            text-shadow: 2px 2px 0 #000;
        }

        /* MAIN LOBBY STAGE */
        .lobby-stage {
            display: flex;
            flex: 1;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
        }

        /* CENTER HERO DISPLAY */
        .hero-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-10px);
        }

        .hero-avatar-card {
            width: 220px;
            height: 280px;
            background: linear-gradient(180deg, #323d5e 0%, #151a28 100%);
            border: 6px solid var(--bs-yellow);
            border-radius: 24px;
            box-shadow: 0 12px 0 #0b0d14, 0 0 30px rgba(255, 204, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transform: rotate(-2deg);
        }

        .hero-icon { font-size: 7rem; filter: drop-shadow(4px 8px 0px #000); }

        .power-level {
            position: absolute;
            bottom: -18px;
            background: var(--bs-purple);
            padding: 4px 16px;
            border-radius: 12px;
            border: 3px solid white;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 #520085;
            text-shadow: 2px 2px 0 #000;
        }

        /* SIDE PANEL MODES */
        .side-panel {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bs-card {
            background: #181e30;
            border: 4px solid #2e3a5c;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 0 #0a0d16;
        }

        /* BRAWL BUTTONS */
        .btn-brawl {
            background: linear-gradient(180deg, var(--bs-yellow) 0%, #ff9900 100%);
            border: 4px solid white;
            border-radius: 20px;
            padding: 18px 30px;
            color: white;
            font-size: 1.8rem;
            font-family: 'Titan One', cursive;
            text-shadow: 3px 3px 0 #804000;
            box-shadow: 0 8px 0 var(--bs-yellow-shadow), 0 15px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;
            width: 100%;
            letter-spacing: 2px;
        }

        .btn-brawl:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 var(--bs-yellow-shadow);
        }

        .btn-blue {
            background: linear-gradient(180deg, var(--bs-blue) 0%, #0055cc 100%);
            text-shadow: 3px 3px 0 #002b66;
            box-shadow: 0 8px 0 var(--bs-blue-dark);
        }

        .btn-green {
            background: linear-gradient(180deg, var(--bs-green) 0%, #1ea800 100%);
            text-shadow: 3px 3px 0 #0d4a00;
            box-shadow: 0 8px 0 var(--bs-green-shadow);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 3px solid #2e3a5c;
            background: #0d101a;
            color: white;
            font-size: 1.1rem;
            font-family: inherit;
            margin-bottom: 10px;
            text-align: center;
        }

        /* BOTTOM PLAY BAR */
        .bottom-bar {
            background: rgba(10, 13, 22, 0.9);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 4px solid #1e263c;
        }

        .event-banner {
            background: linear-gradient(90deg, #ff2255 0%, #9d00ff 100%);
            border: 3px solid white;
            border-radius: 16px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 6px 0 #520085;
            cursor: pointer;
        }

        /* CUTSCENE OVERLAY ENGINE */
        #cutscene-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 12, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: popIn 0.3s ease;
        }

        .cutscene-frame {
            background: #181e30;
            border: 6px solid var(--bs-yellow);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.4);
            max-width: 450px;
        }

        .cutscene-icon { font-size: 6rem; margin-bottom: 15px; animation: bounce 0.8s infinite alternate; }
        .cutscene-title { font-size: 2.2rem; font-family: 'Titan One', cursive; color: var(--bs-yellow); text-shadow: 3px 3px 0 #000; margin-bottom: 10px; }
        .cutscene-text { font-size: 1.2rem; color: #b0c0e0; }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- BRAWL CUTSCENE OVERLAY -->
    <div id="cutscene-overlay">
        <div class="cutscene-frame">
            <div id="cs-icon" class="cutscene-icon">🔍</div>
            <div id="cs-title" class="cutscene-title">FINDING PLAYERS...</div>
            <div id="cs-text" class="cutscene-text">Searching local village lobbies</div>
        </div>
    </div>

    <!-- TOP HUD -->
    <div class="top-hud">
        <div class="profile-badge">
            <div class="profile-avatar">🐺</div>
            <div>
                <input type="text" id="player-name" value="Brawler" style="margin:0; padding:2px; font-size:1rem; width:120px; background:transparent; border:none;">
            </div>
        </div>
        <div class="currency-container">
            <div class="currency-pill">🏆 1,250</div>
            <div class="currency-pill">⚡ 100/100</div>
        </div>
    </div>

    <!-- MAIN LOBBY STAGE -->
    <div class="lobby-stage">

        <!-- LEFT PANEL: CUSTOM ROOMS -->
        <div class="side-panel">
            <div class="bs-card">
                <h3 style="color: var(--bs-yellow); margin-bottom: 10px; font-size: 1.4rem;">CREATE ROOM</h3>
                <label style="font-size: 0.9rem; color:#8a9cc4;">Max Players:</label>
                <select id="create-max" style="width:100%; padding:8px; border-radius:8px; margin-bottom:12px; background:#0d101a; color:white; border:2px solid #2e3a5c;">
                    <option value="4">4 Players</option>
                    <option value="6" selected>6 Players</option>
                    <option value="8">8 Players</option>
                    <option value="10">10 Players</option>
                </select>
                <button class="btn-brawl btn-blue" style="font-size: 1.1rem; padding: 10px;" onclick="handleCreateRoom()">CREATE</button>
            </div>

            <div class="bs-card">
                <h3 style="color: var(--bs-yellow); margin-bottom: 10px; font-size: 1.4rem;">JOIN WITH CODE</h3>
                <input type="text" id="join-code-input" placeholder="CODE" maxlength="5" style="text-transform:uppercase;">
                <button class="btn-brawl btn-green" style="font-size: 1.1rem; padding: 10px;" onclick="handleJoinRoom()">JOIN ROOM</button>
            </div>
        </div>

        <!-- CENTER: HERO SHOWCASE -->
        <div class="hero-display">
            <div class="hero-avatar-card">
                <div class="hero-icon">🐺</div>
                <div class="power-level">POWER 10</div>
            </div>
            <h2 id="hero-display-name" style="margin-top: 30px; font-size: 2rem; text-shadow: 3px 3px 0 #000;">BRAWLER</h2>
        </div>

        <!-- RIGHT PANEL: LOBBY STATUS -->
        <div class="side-panel">
            <div id="lobby-card" class="bs-card hidden">
                <h3 style="color: var(--bs-yellow);">ROOM CODE: <span id="lb-code" style="color:white;">-----</span></h3>
                <p style="margin-top: 5px; color:#8a9cc4;">PLAYERS: <span id="lb-count">0</span>/<span id="lb-max">0</span></p>
                
                <ul id="lb-players" style="list-style: none; margin: 15px 0; max-height: 120px; overflow-y: auto;"></ul>

                <button id="btn-start-brawl" class="btn-brawl" style="font-size: 1.2rem; padding: 12px; display: none;" onclick="handleStartGame()" disabled>START BRAWL</button>
            </div>
        </div>

    </div>

    <!-- BOTTOM MATCHMAKING PLAY BAR -->
    <div class="bottom-bar">
        <div class="event-banner">
            <span style="font-size: 2.5rem;">🌙</span>
            <div>
                <div style="font-size: 0.8rem; color: #ff99bb;">CURRENT EVENT</div>
                <div style="font-size: 1.4rem; text-shadow: 2px 2px 0 #000;">WEREWOLF HUNT</div>
            </div>
        </div>

        <div style="width: 320px;">
            <button id="btn-matchmaking" class="btn-brawl" onclick="handleFindOnlineGame()">FIND PLAYERS</button>
        </div>
    </div>

    <script>
        let gameState = {
            roomCode: '',
            token: '',
            nickname: 'Brawler',
            pollInterval: null
        };

        let cutsceneTimer = null;

        // Sync player input name with hero title
        document.getElementById('player-name').addEventListener('input', (e) => {
            const val = e.target.value.trim() || 'Brawler';
            document.getElementById('hero-display-name').innerText = val.toUpperCase();
        });

        // Utility: Escape HTML strings to prevent XSS
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Brawl Stars Cutscene Player
        function playBrawlCutscene(sceneKey, onComplete) {
            const overlay = document.getElementById('cutscene-overlay');
            const icon = document.getElementById('cs-icon');
            const title = document.getElementById('cs-title');
            const text = document.getElementById('cs-text');

            const scenes = {
                'scene_matchmaking_search': { icon: '🔍', title: 'SEARCHING...', text: 'Looking for open Brawler lobbies' },
                'scene_match_found': { icon: '⚔️', title: 'MATCH FOUND!', text: 'Entering active village room' },
                'scene_joining_room': { icon: '🚪', title: 'JOINING ROOM', text: 'Connecting with room code' },
                'scene_room_created': { icon: '🏰', title: 'LOBBY READY!', text: 'Share code with friends' },
                'scene_night_falls': { icon: '🌙', title: 'BRAWL START!', text: 'Cards dealt! The night begins...' },
                'scene_error': { icon: '💥', title: 'ERROR!', text: 'Could not perform action' }
            };

            const sc = scenes[sceneKey] || { icon: '🔮', title: 'LOADING...', text: '' };
            icon.innerText = sc.icon;
            title.innerText = sc.title;
            text.innerText = sc.text;

            overlay.style.display = 'flex';

            if (cutsceneTimer) {
                clearTimeout(cutsceneTimer);
            }

            cutsceneTimer = setTimeout(() => {
                overlay.style.display = 'none';
                if (onComplete) onComplete();
            }, 2000);
        }

        function getNickname() {
            return document.getElementById('player-name').value.trim() || 'Brawler';
        }

        // FIND PLAYERS ONLINE (Matchmaking)
        async function handleFindOnlineGame() {
            gameState.nickname = getNickname();
            playBrawlCutscene('scene_matchmaking_search');

            try {
                const res = await fetch('backend.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ action: 'find_online_game', nickname: gameState.nickname })
                });

                const data = await res.json();
                if (data.status === 'success') {
                    gameState.roomCode = data.room_code;
                    gameState.token = data.token;
                    playBrawlCutscene(data.cutscene, () => {
                        enterLobby();
                    });
                } else {
                    playBrawlCutscene('scene_error', () => {
                        alert(data.message || 'Unable to find game.');
                    });
                }
            } catch (e) {
                playBrawlCutscene('scene_error', () => {
                    alert("Network error connecting to backend server.");
                });
            }
        }

        // CREATE CUSTOM ROOM
        async function handleCreateRoom() {
            gameState.nickname = getNickname();
            const max = document.getElementById('create-max').value;

            try {
                const res = await fetch('backend.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ action: 'create_room', nickname: gameState.nickname, max_players: max, is_public: 0 })
                });

                const data = await res.json();
                if (data.status === 'success') {
                    gameState.roomCode = data.room_code;
                    gameState.token = data.token;
                    playBrawlCutscene(data.cutscene, () => {
                        enterLobby();
                    });
                } else {
                    playBrawlCutscene('scene_error', () => {
                        alert(data.message || 'Error creating room.');
                    });
                }
            } catch (e) {
                playBrawlCutscene('scene_error', () => {
                    alert("Network error connecting to backend server.");
                });
            }
        }

        // JOIN WITH CODE
        async function handleJoinRoom() {
            gameState.nickname = getNickname();
            const code = document.getElementById('join-code-input').value.trim().toUpperCase();

            if (code.length !== 5) {
                alert("Enter a valid 5-character Code!");
                return;
            }

            try {
                const res = await fetch('backend.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ action: 'join_room', nickname: gameState.nickname, room_code: code })
                });

                const data = await res.json();
                if (data.status === 'success') {
                    gameState.roomCode = data.room_code;
                    gameState.token = data.token;
                    playBrawlCutscene(data.cutscene, () => {
                        enterLobby();
                    });
                } else {
                    playBrawlCutscene('scene_error', () => {
                        alert(data.message || 'Failed to join room.');
                    });
                }
            } catch (e) {
                playBrawlCutscene('scene_error', () => {
                    alert("Network error connecting to backend server.");
                });
            }
        }

        // START GAME
        async function handleStartGame() {
            try {
                const res = await fetch('backend.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ action: 'start_game', room_code: gameState.roomCode, token: gameState.token })
                });

                const data = await res.json();
                if (data.status === 'success') {
                    playBrawlCutscene(data.cutscene);
                } else {
                    playBrawlCutscene('scene_error', () => {
                        alert(data.message || 'Error starting game.');
                    });
                }
            } catch (e) {
                playBrawlCutscene('scene_error', () => {
                    alert("Network error connecting to backend server.");
                });
            }
        }

        // ENTER LOBBY & START POLLING
        function enterLobby() {
            document.getElementById('lobby-card').classList.remove('hidden');
            document.getElementById('lb-code').innerText = gameState.roomCode;

            if (gameState.pollInterval) {
                clearInterval(gameState.pollInterval);
            }

            const poll = async () => {
                try {
                    const res = await fetch('backend.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ action: 'poll_lobby', room_code: gameState.roomCode, token: gameState.token })
                    });

                    const data = await res.json();
                    if (data.status === 'success') {
                        document.getElementById('lb-count').innerText = data.current_count;
                        document.getElementById('lb-max').innerText = data.max_players;

                        document.getElementById('lb-players').innerHTML = data.players.map(p => 
                            `<li style="background:#0d101a; padding:6px 12px; margin-bottom:4px; border-radius:6px; border-left:3px solid var(--bs-yellow);">👤 ${escapeHtml(p)}</li>`
                        ).join('');

                        const startBtn = document.getElementById('btn-start-brawl');
                        if (data.is_host) {
                            startBtn.style.display = 'block';
                            startBtn.disabled = data.current_count < 4;
                        } else {
                            startBtn.style.display = 'none';
                        }

                        if (data.room_status === 'night') {
                            clearInterval(gameState.pollInterval);
                            alert(`Game Started! Your Secret Role: ${data.my_role}`);
                        }
                    } else {
                        clearInterval(gameState.pollInterval);
                        alert(data.message || 'Disconnected from lobby.');
                    }
                } catch (err) {
                    console.error('Polling error:', err);
                }
            };

            poll();
            gameState.pollInterval = setInterval(poll, 1500);
        }
    </script>
</body>
</html>
