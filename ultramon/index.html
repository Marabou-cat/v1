<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Catching RPG - Fullscreen Map & Battle</title>
    <style>
        :root {
            --bg0: #000814; 
            --bg1: #001d3d; 
            --bg2: #003566;
            --p0: #0077b6; 
            --p1: #90e0ef; 
            --p2: #03045e;
            --w: #caf0f8;
            --hp-green: #2ecc71;
            --hp-red: #e74c3c;
            --gold: #ffd700;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Lock viewport scroll */
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #000;
            color: var(--w);
        }

        /* --- TOP LEFT ICON BAR --- */
        .top-nav-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            background: rgba(0, 29, 61, 0.85);
            border: 2px solid var(--p0);
            border-radius: 12px;
            padding: 8px 16px;
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .nav-btn:hover {
            background: var(--p0);
            transform: translateY(-2px);
        }

        .hamburger-icon {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 18px;
        }

        .hamburger-icon span {
            display: block;
            height: 3px;
            background: #fff;
            border-radius: 2px;
        }

        .pet-nav-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* --- STATS HUD (TOP RIGHT) --- */
        .top-right-hud {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 500;
            display: flex;
            gap: 10px;
        }

        .hud-badge {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--p1);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 800;
            color: var(--gold);
            font-size: 14px;
            backdrop-filter: blur(6px);
        }

        /* --- FULLSCREEN MAP --- */
        .map-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .tile {
            width: 100%;
            height: 100%;
            user-select: none;
            position: relative;
            box-sizing: border-radius;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .tile-grass { background: #27ae60; }
        .tile-tall_grass { background: #1e8449; }
        .tile-tall_grass::after {
            content: "🌿";
            font-size: calc(2vw + 1vh);
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
        }

        .tile-wall {
            background: #34495e;
            border: 1px solid #2c3e50;
        }
        .tile-wall::after {
            content: "🪨";
            font-size: calc(1.5vw + 1vh);
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* PLAYER: Cube Body + Stick Arms */
        .player-cube {
            position: absolute;
            z-index: 100;
            background: #e74c3c;
            border: 3px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.9);
            transition: all 0.12s ease-out;
            transform: translate(-50%, -50%);
        }

        .player-cube::before {
            content: "";
            position: absolute;
            left: -10px;
            top: 40%;
            width: 10px;
            height: 4px;
            background: #000000;
        }

        .player-cube::after {
            content: "";
            position: absolute;
            right: -10px;
            top: 40%;
            width: 10px;
            height: 4px;
            background: #000000;
        }

        /* --- FULLSCREEN POKÉMON BATTLE OVERLAY --- */
        .battle-overlay {
            position: fixed;
            inset: 0;
            z-index: 8000;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .battle-overlay.hidden { display: none; }

        .battle-arena {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            position: relative;
        }

        .battle-entity {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .pet-sprite {
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        .pet-stats-box {
            background: rgba(0, 29, 61, 0.9);
            border: 2px solid var(--p0);
            border-radius: 12px;
            padding: 12px 20px;
            width: 220px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .hp-bar-outer {
            background: #333;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 6px;
        }

        .hp-bar-inner {
            background: var(--hp-green);
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }

        .battle-console {
            background: var(--bg1);
            border: 3px solid var(--p0);
            border-radius: 16px;
            height: 160px;
            display: flex;
            padding: 15px;
            gap: 20px;
        }

        .battle-log {
            flex: 2;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            line-height: 1.5;
            display: flex;
            align-items: center;
        }

        .battle-actions {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-battle {
            background: var(--bg2);
            border: 2px solid var(--p0);
            color: #fff;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-battle:hover {
            background: var(--p0);
            transform: scale(1.02);
        }

        /* --- OVERLAYS & MODALS --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 8, 20, 0.95);
            backdrop-filter: blur(8px);
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .modal-overlay.hidden { display: none; }

        #starterOverlay { background: #000000; }

        .starter-box {
            background: #090a0f;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .starter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .starter-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }

        .starter-card:hover { transform: translateY(-8px); }

        .starter-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .side-drawer {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 320px;
            background: var(--bg1);
            border-right: 2px solid var(--p0);
            z-index: 7000;
            padding: 80px 20px 20px;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
        }

        .side-drawer.open { transform: translateX(0); }
    </style>
</head>
<body>

<!-- TOP LEFT ACTION ICON BAR -->
<div class="top-nav-bar">
    <button class="nav-btn" onclick="toggleMenuDrawer()">
        <div class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <span>MENU</span>
    </button>

    <button class="nav-btn" onclick="togglePartyDrawer()">
        <img src="petpng/petmenu" alt="Pet Menu" class="pet-nav-icon" onerror="this.src='sproupup.png'">
        <span>PETS</span>
    </button>
</div>

<!-- TOP RIGHT HUD -->
<div class="top-right-hud">
    <div class="hud-badge">🪙 <span id="coinDisplay">100</span></div>
    <div class="hud-badge" style="color:#00ffcc; border-color:#00ffcc;">🎾 <span id="ballDisplay">5</span></div>
</div>

<!-- SIDE MENU DRAWER -->
<div class="side-drawer" id="menuDrawer">
    <h2 style="color:var(--p1); margin-top:0;">Game Menu</h2>
    <hr style="border-color:var(--p0);">
    <p>Route: 1 (Map Coordinates)</p>
    <button class="nav-btn" style="width:100%; margin-top:15px;" onclick="visitCenter()">🏥 Pokémon Center</button>
    <button class="nav-btn" style="width:100%; margin-top:10px; background:#2ecc71;" onclick="saveGameData()">💾 Save Game</button>
</div>

<!-- SIDE PETS DRAWER -->
<div class="side-drawer" id="partyDrawer">
    <h2 style="color:var(--p1); margin-top:0;">Your Pets (<span id="partyCount">0</span>/6)</h2>
    <hr style="border-color:var(--p0);">
    <div id="drawerPartyList"></div>
</div>

<!-- FULLSCREEN 12x12 MAP -->
<div class="map-viewport">
    <div class="map-grid" id="mapGrid"></div>
</div>

<!-- STARTER SELECTION MODAL -->
<div class="modal-overlay hidden" id="starterOverlay">
    <div class="starter-box">
        <h2 style="color:var(--p1); font-size:28px;">Choose Your Partner</h2>
        <p style="opacity:0.8;">Select your starting pet to begin exploring:</p>
        
        <div class="starter-grid">
            <div class="starter-card" onclick="selectStarter('sproupup', 'Sproupup')">
                <img src="sproupup.png" class="starter-img">
                <h3>Sproupup</h3>
            </div>
            <div class="starter-card" onclick="selectStarter('bubbitty', 'Bubbitty')">
                <img src="bubbitty.png" class="starter-img">
                <h3>Bubbitty</h3>
            </div>
            <div class="starter-card" onclick="selectStarter('flaragon', 'Flaragon')">
                <img src="flaragon.png" class="starter-img">
                <h3>Flaragon</h3>
            </div>
        </div>
    </div>
</div>

<!-- POKEMON BATTLE SCREEN OVERLAY -->
<div class="battle-overlay hidden" id="battleOverlay">
    <div class="battle-arena">
        <!-- Player Active Pet -->
        <div class="battle-entity">
            <div class="pet-stats-box">
                <div style="font-weight:bold; font-size:16px;" id="playerPetName">Sproupup</div>
                <div style="font-size:12px; opacity:0.8;" id="playerPetLvl">Lv. 5</div>
                <div class="hp-bar-outer">
                    <div class="hp-bar-inner" id="playerHpBar"></div>
                </div>
                <div style="font-size:11px; text-align:right; margin-top:3px;" id="playerHpText">50/50</div>
            </div>
            <img id="playerPetImg" src="sproupup.png" class="pet-sprite">
        </div>

        <!-- Wild Pet Enemy -->
        <div class="battle-entity">
            <img id="wildPetImg" src="flaragon.png" class="pet-sprite">
            <div class="pet-stats-box">
                <div style="font-weight:bold; font-size:16px;" id="wildPetName">Wild Pet</div>
                <div style="font-size:12px; opacity:0.8;" id="wildPetLvl">Lv. 3</div>
                <div class="hp-bar-outer">
                    <div class="hp-bar-inner" id="wildHpBar"></div>
                </div>
                <div style="font-size:11px; text-align:right; margin-top:3px;" id="wildHpText">30/30</div>
            </div>
        </div>
    </div>

    <div class="battle-console">
        <div class="battle-log" id="battleLogText">A wild pet appeared! What will you do?</div>
        <div class="battle-actions">
            <button class="btn-battle" onclick="battleAttack()">⚔️ Attack</button>
            <button class="btn-battle" onclick="battleCatch()">🎾 Catch</button>
            <button class="btn-battle" style="grid-column: span 2; background:#e74c3c;" onclick="battleRun()">🏃 Run</button>
        </div>
    </div>
</div>

<script src="pets.js"></script>
<script>
    // --- STATE ---
    let playerParty = [];
    let coins = 100;
    let balls = 5;
    let inBattle = false;
    let wildPet = null;
    let activePlayerPet = null;

    // --- MAP CONFIG (12x12 Fullscreen) ---
    const GRID_SIZE = 12;
    let playerPos = { x: 1, y: 1 };

    const mapTiles = [
        ['wall','wall','wall','wall','wall','wall','wall','wall','wall','wall','wall','wall'],
        ['wall','grass','grass','tall_grass','tall_grass','grass','grass','grass','grass','grass','grass','wall'],
        ['wall','grass','wall','wall','tall_grass','grass','wall','wall','grass','wall','grass','wall'],
        ['wall','tall_grass','wall','grass','grass','grass','grass','wall','tall_grass','wall','grass','wall'],
        ['wall','tall_grass','grass','grass','tall_grass','tall_grass','grass','grass','tall_grass','grass','grass','wall'],
        ['wall','grass','grass','tall_grass','tall_grass','tall_grass','tall_grass','grass','grass','grass','grass','wall'],
        ['wall','grass','wall','tall_grass','grass','grass','tall_grass','wall','grass','wall','grass','wall'],
        ['wall','grass','wall','grass','grass','grass','grass','wall','grass','wall','grass','wall'],
        ['wall','grass','grass','grass','tall_grass','tall_grass','grass','grass','grass','grass','grass','wall'],
        ['wall','tall_grass','grass','grass','tall_grass','grass','grass','tall_grass','grass','grass','grass','wall'],
        ['wall','grass','grass','grass','grass','grass','grass','grass','grass','grass','grass','wall'],
        ['wall','wall','wall','wall','wall','wall','wall','wall','wall','wall','wall','wall']
    ];

    window.addEventListener('DOMContentLoaded', () => {
        buildMap();
        setupInput();
        checkStarter();
    });

    function buildMap() {
        const grid = document.getElementById('mapGrid');
        grid.innerHTML = '';

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const tile = document.createElement('div');
                const type = mapTiles[r][c];
                tile.className = `tile tile-${type}`;
                tile.id = `tile-${r}-${c}`;
                grid.appendChild(tile);
            }
        }

        renderPlayer();
    }

    function renderPlayer() {
        let player = document.getElementById('playerCube');
        if (!player) {
            player = document.createElement('div');
            player.id = 'playerCube';
            player.className = 'player-cube';
            document.getElementById('mapGrid').appendChild(player);
        }

        const tileWidth = window.innerWidth / GRID_SIZE;
        const tileHeight = window.innerHeight / GRID_SIZE;

        player.style.width = (tileWidth * 0.6) + 'px';
        player.style.height = (tileHeight * 0.6) + 'px';

        player.style.left = (playerPos.x * tileWidth + tileWidth / 2) + 'px';
        player.style.top = (playerPos.y * tileHeight + tileHeight / 2) + 'px';
    }

    window.addEventListener('resize', renderPlayer);

    function setupInput() {
        window.addEventListener('keydown', (e) => {
            if (inBattle || playerParty.length === 0) return; // Freeze movement during battle/starter pick

            let dx = 0, dy = 0;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') dy = -1;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') dy = 1;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') dx = -1;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') dx = 1;

            if (dx !== 0 || dy !== 0) {
                const nx = playerPos.x + dx;
                const ny = playerPos.y + dy;

                if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                    if (mapTiles[ny][nx] !== 'wall') {
                        playerPos.x = nx;
                        playerPos.y = ny;
                        renderPlayer();

                        if (mapTiles[ny][nx] === 'tall_grass' && Math.random() < 0.45) {
                            startBattle();
                        }
                    }
                }
            }
        });
    }

    // --- POKÉMON-STYLE BATTLE SYSTEM ---
    function startBattle() {
        inBattle = true;
        
        const speciesKeys = Object.keys(PETS);
        const randomId = speciesKeys[Math.floor(Math.random() * speciesKeys.length)];
        const wildLevel = Math.floor(Math.random() * 3) + 3;

        wildPet = getCalculatedPet({ id: randomId, lvl: wildLevel });
        activePlayerPet = getCalculatedPet(playerParty[0]);

        // Setup Player UI
        document.getElementById('playerPetName').innerText = activePlayerPet.name;
        document.getElementById('playerPetLvl').innerText = `Lv. ${activePlayerPet.level}`;
        document.getElementById('playerPetImg').src = `${activePlayerPet.id}.png`;
        updateBattleHp('player', activePlayerPet.currentHp, activePlayerPet.maxHp);

        // Setup Enemy UI
        document.getElementById('wildPetName').innerText = wildPet.name;
        document.getElementById('wildPetLvl').innerText = `Lv. ${wildPet.level}`;
        document.getElementById('wildPetImg').src = `${wildPet.id}.png`;
        updateBattleHp('wild', wildPet.currentHp, wildPet.maxHp);

        document.getElementById('battleLogText').innerHTML = `⚔️ A wild <strong>${wildPet.name}</strong> appeared! Movement frozen.`;
        document.getElementById('battleOverlay').classList.remove('hidden');
    }

    function battleAttack() {
        if (!wildPet || !activePlayerPet) return;

        // Player attacks enemy
        const dmg = Math.max(2, activePlayerPet.attack - Math.floor(wildPet.defense / 2));
        wildPet.currentHp = Math.max(0, wildPet.currentHp - dmg);
        updateBattleHp('wild', wildPet.currentHp, wildPet.maxHp);

        if (wildPet.currentHp <= 0) {
            document.getElementById('battleLogText').innerHTML = `💥 You defeated wild <strong>${wildPet.name}</strong>! Earned +15 Coins.`;
            coins += 15;
            updateUI();
            setTimeout(endBattle, 1500);
            return;
        }

        // Enemy counters
        const enemyDmg = Math.max(2, wildPet.attack - Math.floor(activePlayerPet.defense / 2));
        activePlayerPet.currentHp = Math.max(0, activePlayerPet.currentHp - enemyDmg);
        playerParty[0].hp = activePlayerPet.currentHp;
        updateBattleHp('player', activePlayerPet.currentHp, activePlayerPet.maxHp);

        if (activePlayerPet.currentHp <= 0) {
            document.getElementById('battleLogText').innerHTML = `💀 Your pet fainted! You safely fled back to center.`;
            setTimeout(endBattle, 1500);
        } else {
            document.getElementById('battleLogText').innerHTML = `Hit wild <strong>${wildPet.name}</strong> for ${dmg} DMG! Enemy dealt ${enemyDmg} DMG.`;
        }
    }

    function battleCatch() {
        if (balls <= 0) {
            document.getElementById('battleLogText').innerHTML = `❌ Out of Catch Balls!`;
            return;
        }

        balls--;
        updateUI();

        if (playerParty.length >= 6) {
            document.getElementById('battleLogText').innerHTML = `⚠️ Your pet party is full!`;
            return;
        }

        if (Math.random() < 0.65) {
            playerParty.push({ id: wildPet.id, lvl: wildPet.level, hp: wildPet.maxHp });
            document.getElementById('battleLogText').innerHTML = `🎉 Gotcha! <strong>${wildPet.name}</strong> was caught!`;
            setTimeout(endBattle, 1500);
        } else {
            document.getElementById('battleLogText').innerHTML = `💨 Wild <strong>${wildPet.name}</strong> broke free!`;
        }
    }

    function battleRun() {
        document.getElementById('battleLogText').innerHTML = `🏃 Got away safely!`;
        setTimeout(endBattle, 1000);
    }

    function endBattle() {
        inBattle = false;
        document.getElementById('battleOverlay').classList.add('hidden');
        renderPartyDrawers();
    }

    function updateBattleHp(type, cur, max) {
        const pct = Math.max(0, (cur / max) * 100);
        const bar = document.getElementById(type === 'player' ? 'playerHpBar' : 'wildHpBar');
        const text = document.getElementById(type === 'player' ? 'playerHpText' : 'wildHpText');

        bar.style.width = pct + '%';
        bar.style.background = pct < 30 ? 'var(--hp-red)' : 'var(--hp-green)';
        text.innerText = `${cur}/${max}`;
    }

    // --- UTILITIES ---
    function checkStarter() {
        if (playerParty.length === 0) {
            document.getElementById('starterOverlay').classList.remove('hidden');
        }
    }

    function selectStarter(id, name) {
        playerParty = [{ id, lvl: 5, hp: 50 }];
        document.getElementById('starterOverlay').classList.add('hidden');
        renderPartyDrawers();
    }

    function toggleMenuDrawer() {
        document.getElementById('menuDrawer').classList.toggle('open');
        document.getElementById('partyDrawer').classList.remove('open');
    }

    function togglePartyDrawer() {
        document.getElementById('partyDrawer').classList.toggle('open');
        document.getElementById('menuDrawer').classList.remove('open');
    }

    function renderPartyDrawers() {
        const list = document.getElementById('drawerPartyList');
        document.getElementById('partyCount').innerText = playerParty.length;
        list.innerHTML = '';

        playerParty.forEach(p => {
            const pet = getCalculatedPet(p);
            if (!pet) return;
            list.innerHTML += `
                <div style="background:rgba(0,0,0,0.4); border:1px solid var(--p2); border-radius:8px; padding:10px; margin-bottom:8px;">
                    <strong>${pet.name}</strong> (Lv. ${pet.level})<br>
                    <small>HP: ${pet.currentHp}/${pet.maxHp} | Type: ${pet.type}</small>
                </div>
            `;
        });
    }

    function visitCenter() {
        playerParty.forEach(p => {
            const pet = getCalculatedPet(p);
            if (pet) p.hp = pet.maxHp;
        });
        renderPartyDrawers();
        alert('🏥 All pets healed to full HP!');
    }

    function updateUI() {
        document.getElementById('coinDisplay').innerText = coins;
        document.getElementById('ballDisplay').innerText = balls;
    }
</script>
</body>
</html>
