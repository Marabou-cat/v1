<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Online</title>
    <!-- Embedded Styled Fonts from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: #0d0e14;
            --panel-border: #1a1d26;
            --accent-red: #e60012;
            --accent-red-hover: #ff1a2c;
            --accent-gold: #ffcc00;
            --text-light: #ffffff;
            --text-muted: #8c92a4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            background-image: radial-gradient(circle at center, #14080a 0%, #050508 70%);
        }

        /* Container - Brawl Stars Arena Panel Look */
        .container {
            width: 100%;
            max-width: 580px;
            background: var(--panel-bg);
            border: 3px solid var(--panel-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 2px 5px rgba(255, 255, 255, 0.05);
            position: relative;
        }

        @media (min-width: 768px) {
            .container { padding: 36px; }
        }

        /* Full-screen override for active game arena */
        body.in-game-layout {
            padding: 0;
            align-items: stretch;
        }

        body.in-game-layout .container {
            max-width: 100% !important;
            height: 100vh;
            border-radius: 0;
            border: none;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            padding: 20px;
            box-shadow: none;
        }

        @media (min-width: 768px) {
            body.in-game-layout .container { padding: 32px 48px; }
        }

        body.in-game-layout #view-game {
            display: flex;
            flex-direction: column;
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        body.in-game-layout #game-player-list {
            flex: 1;
            max-height: none;
        }

        h1 { 
            text-align: center; 
            color: var(--accent-red); 
            font-family: 'Cinzel', serif;
            font-size: 2.5rem; 
            font-weight: 900;
            margin-bottom: 2px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(230, 0, 18, 0.5), 0 0 30px rgba(230, 0, 18, 0.2);
            -webkit-text-stroke: 1px #5c0006;
        }

        @media (min-width: 768px) {
            h1 { font-size: 3.2rem; }
        }

        p.subtitle { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            font-weight: 800;
            margin-bottom: 24px; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 800; font-size: 0.85rem; color: #a0aec0; letter-spacing: 1px; text-transform: uppercase; }
        
        input, select {
            width: 100%;
            padding: 16px;
            background: #050608;
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-red); box-shadow: 0 0 12px rgba(230, 0, 18, 0.3); }

        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
        @media (min-width: 480px) {
            .btn-group { flex-direction: row; }
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.5);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
        }

        .btn-primary { 
            background: linear-gradient(180deg, #ff1a2c 0%, var(--accent-red) 100%); 
            color: white; 
            border: 2px solid #ff6b75;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .btn-primary:hover { background: linear-gradient(180deg, #ff3342 0%, #ff1a2c 100%); }
        
        .btn-secondary { 
            background: linear-gradient(180deg, #242836 0%, #151821 100%); 
            color: #cbd5e1; 
            border: 2px solid #2f3545; 
        }
        .btn-secondary:hover { background: linear-gradient(180deg, #2e3445 0%, #1a1d26 100%); color: white; }
        
        .btn-action { 
            background: linear-gradient(180deg, #38ef7d 0%, #11998e 100%); 
            color: #050508; 
            padding: 8px 16px; 
            font-size: 0.8rem; 
            width: auto; 
            border-radius: 8px; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            box-shadow: 0 4px 0 #0b5d56;
            font-weight: 800;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px 0 #0b5d56; }
        
        .btn-voted { background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%) !important; color: #050508 !important; cursor: default; box-shadow: 0 4px 0 #006096 !important; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .room-badge {
            background: linear-gradient(180deg, #151821 0%, #090a0f 100%);
            border: 3px solid var(--accent-gold);
            padding: 16px;
            text-align: center;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 8px rgba(255, 204, 0, 0.2);
        }
        .room-code { 
            font-family: 'Cinzel', serif;
            font-size: 2.6rem; 
            font-weight: 900; 
            color: var(--accent-gold); 
            letter-spacing: 8px; 
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }

        .player-list { list-style: none; margin-bottom: 20px; max-height: 280px; overflow-y: auto; padding-right: 4px; }
        .player-list::-webkit-scrollbar { width: 6px; }
        .player-list::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

        .player-item {
            background: linear-gradient(90deg, #12151e 0%, #0a0c12 100%);
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid var(--accent-gold);
            font-size: 1rem;
            font-weight: 700;
            border-top: 1px solid var(--panel-border);
            border-right: 1px solid var(--panel-border);
            border-bottom: 1px solid var(--panel-border);
        }
        .player-item.dead { border-left-color: var(--accent-red); opacity: 0.5; text-decoration: line-through; }
        .player-info-wrap { display: flex; align-items: center; gap: 12px; }

        .role-preview {
            background: #07080c;
            padding: 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 2px solid var(--panel-border);
            line-height: 1.6;
            font-weight: 700;
        }
        .role-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; background: #151821; margin: 3px; border: 1px solid #232836; font-weight: 800; }

        .role-card {
            background: linear-gradient(135deg, #1b151a 0%, #0d0e14 100%);
            border: 3px solid var(--accent-red);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(230, 0, 18, 0.25);
        }
        .card-title { 
            font-family: 'Cinzel', serif;
            font-size: 2rem; 
            font-weight: 900; 
            color: var(--accent-gold); 
            margin-bottom: 6px; 
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(255, 204, 0, 0.4);
        }

        .event-banner {
            background: linear-gradient(180deg, #141013 0%, #0a0b0f 100%);
            border-left: 6px solid var(--accent-red);
            padding: 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            color: #f1f5f9;
            line-height: 1.6;
            font-weight: 700;
            border-top: 1px solid var(--panel-border);
            border-right: 1px solid var(--panel-border);
            border-bottom: 1px solid var(--panel-border);
        }

        #cutscene-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 3, 5, 0.97);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .cutscene-icon { font-size: 4.5rem; margin-bottom: 20px; animation: pulse 1.5s infinite; color: var(--accent-red); }
        .cutscene-text { 
            font-family: 'Cinzel', serif;
            font-size: 2rem; 
            font-weight: 900; 
            color: var(--accent-gold); 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            text-shadow: 0 2px 10px rgba(255, 204, 0, 0.4);
        }
        .cutscene-sub { font-size: 1rem; color: var(--text-muted); margin-top: 10px; font-weight: 800; letter-spacing: 1px; }

        @media (min-width: 768px) {
            .cutscene-text { font-size: 2.6rem; }
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- CUTSCENE OVERLAY -->
    <div id="cutscene-overlay">
        <div id="cutscene-icon" class="cutscene-icon"><i data-lucide="castle" size="72"></i></div>
        <div id="cutscene-text" class="cutscene-text">Building Fortress...</div>
        <div id="cutscene-sub" class="cutscene-sub">Preparing the lobby</div>
    </div>

    <div class="container">
        <h1>Werewolf</h1>
        <p class="subtitle">Online Multiplayer Arena</p>

        <!-- VIEW 1: MAIN MENU -->
        <div id="view-menu">
            <div class="form-group">
                <label for="nickname">Your Nickname</label>
                <input type="text" id="nickname" placeholder="e.g., HunterJohn" value="Player1">
            </div>

            <div class="btn-group">
                <button class="btn-primary" onclick="showScreen('view-create')">Create Room</button>
                <button class="btn-secondary" onclick="showScreen('view-join')">Join Room</button>
            </div>
        </div>

        <!-- VIEW 2: CREATE ROOM -->
        <div id="view-create" class="hidden">
            <div class="form-group">
                <label for="max-players">Select Total Players (Min 4)</label>
                <select id="max-players" onchange="updateRolePreview()">
                    <option value="4" selected>4 Players (1 Werewolf, 0 Specials)</option>
                    <option value="5">5 Players (1 Werewolf, 1 Special)</option>
                    <option value="6">6 Players (1 Werewolf, 1 Special)</option>
                    <option value="7">7 Players (2 Werewolves, 2 Specials)</option>
                    <option value="8">8 Players (2 Werewolves, 2 Specials)</option>
                    <option value="9">9 Players (2 Werewolves, 3 Specials)</option>
                    <option value="10">10 Players (3 Werewolves, 3 Specials)</option>
                </select>
            </div>

            <div id="create-role-info" class="role-preview">Role Calculation Preview...</div>

            <div class="btn-group">
                <button class="btn-primary" onclick="handleCreateRoom()">Confirm & Host</button>
                <button class="btn-secondary" onclick="showScreen('view-menu')">Back</button>
            </div>
        </div>

        <!-- VIEW 3: JOIN ROOM -->
        <div id="view-join" class="hidden">
            <div class="form-group">
                <label for="join-code">Enter 5-Character Room Code</label>
                <input type="text" id="join-code" placeholder="e.g., A1B2C" maxlength="5" style="text-transform: uppercase;">
            </div>

            <div class="btn-group">
                <button class="btn-primary" onclick="handleJoinRoom()">Join Lobby</button>
                <button class="btn-secondary" onclick="showScreen('view-menu')">Back</button>
            </div>
        </div>

        <!-- VIEW 4: LOBBY SCREEN -->
        <div id="view-lobby" class="hidden">
            <div class="room-badge">
                <span style="font-size: 0.75rem; color: var(--accent-gold); display: block; margin-bottom: 4px; letter-spacing: 2px; font-weight: 800;">BATTLE CODE</span>
                <span id="display-room-code" class="room-code">-----</span>
            </div>

            <label style="margin-bottom: 10px;">Squad Members (<span id="player-count">0</span>/<span id="player-max">0</span>):</label>
            <ul id="player-list-ui" class="player-list"></ul>

            <div id="lobby-role-breakdown" class="role-preview">Waiting for roster...</div>

            <div id="host-controls">
                <button id="btn-start-game" class="btn-primary" style="width: 100%;" onclick="handleStartGame()" disabled>
                    Start Match (Host Only)
                </button>
            </div>
        </div>

        <!-- VIEW 5: ACTIVE GAME SCREEN -->
        <div id="view-game" class="hidden">
            <div class="role-card">
                <p style="font-size: 0.75rem; color: var(--accent-gold); margin-bottom: 4px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800;">Assigned Role</p>
                <div id="my-role-display" class="card-title">Secret Card</div>
                <p id="my-role-desc" style="font-size: 0.9rem; color: #cbd5e1; font-weight: 700;">Survive the night and expose the threat!</p>
            </div>

            <div class="event-banner">
                <strong>Phase: <span id="game-phase-text" style="color: var(--accent-gold);">Night</span></strong><br>
                <span id="game-event-log">Night falls upon the village...</span>
            </div>

            <label id="game-list-label" style="margin-bottom: 10px;">Living Players:</label>
            <ul id="game-player-list" class="player-list"></ul>

            <button id="btn-back-menu" class="btn-secondary hidden" style="width: 100%; margin-top: 12px;" onclick="showScreen('view-menu')">Return to Menu</button>
        </div>

    </div>

    <script>
        let state = {
            roomCode: '',
            token: '',
            nickname: '',
            isHost: false,
            pollInterval: null
        };

        function showScreen(screenId) {
            ['view-menu', 'view-create', 'view-join', 'view-lobby', 'view-game'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');

            if (screenId === 'view-game') {
                document.body.classList.add('in-game-layout');
            } else {
                document.body.classList.remove('in-game-layout');
            }

            if(screenId === 'view-create') updateRolePreview();
            lucide.createIcons();
        }

        function updateRolePreview() {
            const count = parseInt(document.getElementById('max-players').value);
            const wolves = 1 + Math.floor((count - 4) / 3);
            const specials = count === 4 ? 0 : Math.floor((count - 3) / 2);
            const villagers = count - (wolves + specials);

            document.getElementById('create-role-info').innerHTML = `
                <strong>Squad Composition:</strong><br>
                <span class="role-tag" style="color: #ff4d4d;"><i data-lucide="skull" size="14"></i> Werewolves: ${wolves}</span>
                <span class="role-tag" style="color: var(--accent-gold);"><i data-lucide="sparkles" size="14"></i> Specials: ${specials}</span>
                <span class="role-tag" style="color: #38bdf8;"><i data-lucide="shield" size="14"></i> Villagers: ${villagers}</span>
            `;
            lucide.createIcons();
        }

        function triggerCutscene(sceneKey, callback) {
            const overlay = document.getElementById('cutscene-overlay');
            const iconContainer = document.getElementById('cutscene-icon');
            const text = document.getElementById('cutscene-text');
            const sub = document.getElementById('cutscene-sub');

            const scenes = {
                'scene_room_created': { icon: 'castle', title: 'Fortress Created', sub: 'Assembling players...' },
                'scene_door_open': { icon: 'door-open', title: 'Entering Arena', sub: 'Joining squad room...' },
                'scene_night_falls': { icon: 'moon', title: 'Blood Moon Rises', sub: 'Battle phase beginning...' },
                'scene_error': { icon: 'zap', title: 'Action Failed', sub: 'An error occurred' }
            };

            const scene = scenes[sceneKey] || { icon: 'help-circle', title: 'Processing...', sub: '' };
            iconContainer.innerHTML = `<i data-lucide="${scene.icon}" size="72"></i>`;
            text.innerText = scene.title;
            sub.innerText = scene.sub;
            lucide.createIcons();

            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.style.display = 'none';
                if(callback) callback();
            }, 2000);
        }

        async function handleCreateRoom() {
            state.nickname = document.getElementById('nickname').value || 'Host';
            const maxPlayers = document.getElementById('max-players').value;

            const res = await fetch('backend.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ action: 'create_room', nickname: state.nickname, max_players: maxPlayers })
            });

            const data = await res.json();
            if (data.status === 'success') {
                state.roomCode = data.room_code;
                state.token = data.token;
                state.isHost = true;
                triggerCutscene(data.cutscene, () => {
                    showScreen('view-lobby');
                    startGamePolling();
                });
            } else {
                alert(data.message);
            }
        }

        async function handleJoinRoom() {
            state.nickname = document.getElementById('nickname').value || 'Villager';
            const code = document.getElementById('join-code').value.trim();

            if (code.length !== 5) {
                alert("Please enter a valid 5-character room code.");
                return;
            }

            const res = await fetch('backend.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ action: 'join_room', nickname: state.nickname, room_code: code })
            });

            const data = await res.json();
            if (data.status === 'success') {
                state.roomCode = data.room_code;
                state.token = data.token;
                state.isHost = false;
                triggerCutscene(data.cutscene, () => {
                    showScreen('view-lobby');
                    startGamePolling();
                });
            } else {
                alert(data.message);
            }
        }

        async function handleStartGame() {
            const res = await fetch('backend.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ action: 'start_game', room_code: state.roomCode, token: state.token })
            });

            const data = await res.json();
            if (data.status === 'success') {
                triggerCutscene(data.cutscene);
            } else {
                alert(data.message);
            }
        }

        async function submitNightAction(targetId) {
            const res = await fetch('backend.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ action: 'night_action', room_code: state.roomCode, token: state.token, target_id: targetId })
            });
            const data = await res.json();
            if(data.status !== 'success') alert(data.message);
        }

        async function submitDayVote(voteId) {
            const res = await fetch('backend.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ action: 'day_vote', room_code: state.roomCode, token: state.token, vote_id: voteId })
            });
            const data = await res.json();
            if(data.status !== 'success') alert(data.message);
        }

        function startGamePolling() {
            document.getElementById('display-room-code').innerText = state.roomCode;
            
            state.pollInterval = setInterval(async () => {
                const res = await fetch('backend.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ action: 'poll_game', room_code: state.roomCode, token: state.token })
                });

                const data = await res.json();
                if (data.status === 'success') {
                    if (data.room_status === 'lobby') {
                        document.getElementById('player-count').innerText = data.current_count;
                        document.getElementById('player-max').innerText = data.max_players;

                        const listUI = document.getElementById('player-list-ui');
                        listUI.innerHTML = data.players.map(p => `
                            <li class="player-item">
                                <span class="player-info-wrap"><i data-lucide="user" size="18" style="color: var(--accent-gold);"></i> ${p.nickname}</span>
                            </li>
                        `).join('');
                        lucide.createIcons();

                        if(data.role_breakdown) {
                            const b = data.role_breakdown;
                            document.getElementById('lobby-role-breakdown').innerHTML = `
                                <strong>Squad Allocation (${data.current_count} Players):</strong><br>
                                <span class="role-tag"><i data-lucide="skull" size="14" style="color: #ff4d4d;"></i> ${b.werewolves} Werewolf</span> 
                                <span class="role-tag"><i data-lucide="sparkles" size="14" style="color: var(--accent-gold);"></i> ${b.specials} Specials</span> 
                                <span class="role-tag"><i data-lucide="shield" size="14" style="color: #38bdf8;"></i> ${b.villagers} Villagers</span>
                            `;
                            lucide.createIcons();
                        }

                        const startBtn = document.getElementById('btn-start-game');
                        if (data.is_host) {
                            startBtn.style.display = 'block';
                            startBtn.disabled = data.current_count < 4;
                        } else {
                            startBtn.style.display = 'none';
                        }
                    } else {
                        const viewGame = document.getElementById('view-game');
                        if (viewGame.classList.contains('hidden')) {
                            showScreen('view-game');
                        }

                        document.getElementById('my-role-display').innerText = data.my_role;
                        document.getElementById('game-event-log').innerHTML = data.last_event || 'Game in progress...';

                        const phaseText = document.getElementById('game-phase-text');
                        const gameListLabel = document.getElementById('game-list-label');
                        const gamePlayerList = document.getElementById('game-player-list');
                        const backMenuBtn = document.getElementById('btn-back-menu');

                        if (data.room_status === 'night') {
                            phaseText.innerHTML = '<i data-lucide="moon" size="16" style="vertical-align: middle;"></i> Night Phase';
                            phaseText.style.color = '#ff4d4d';
                            
                            if (data.my_role === 'Werewolf' && data.is_alive) {
                                gameListLabel.innerText = data.has_voted ? '🔒 Target locked in! Waiting for others...' : 'Select a Victim to Eliminate:';
                            } else {
                                gameListLabel.innerText = 'Squad Members (Asleep):';
                            }
                            
                            gamePlayerList.innerHTML = data.players.map(p => {
                                const isMe = (p.id === data.my_id);
                                const canKill = (data.my_role === 'Werewolf' && data.is_alive && p.is_alive && !isMe);
                                const isTarget = (data.my_target_id === p.id);

                                let actionBtn = '';
                                if (canKill) {
                                    if (isTarget) {
                                        actionBtn = `<button class="btn-action btn-voted" disabled><i data-lucide="check" size="14"></i> Targeted ✓</button>`;
                                    } else {
                                        actionBtn = `<button class="btn-action" onclick="submitNightAction(${p.id})"><i data-lucide="crosshair" size="14"></i> Kill</button>`;
                                    }
                                }

                                const statusIcon = p.is_alive ? '<i data-lucide="shield" size="18" style="color: #38bdf8;"></i>' : '<i data-lucide="skull" size="18" style="color: var(--accent-red);"></i>';

                                return `
                                    <li class="player-item ${p.is_alive ? '' : 'dead'}">
                                        <span class="player-info-wrap">${statusIcon} ${p.nickname} ${isMe ? '(You)' : ''}</span>
                                        ${actionBtn}
                                    </li>
                                `;
                            }).join('');
                            lucide.createIcons();
                        } else if (data.room_status === 'day') {
                            phaseText.innerHTML = '<i data-lucide="sun" size="16" style="vertical-align: middle;"></i> Day Voting Phase';
                            phaseText.style.color = 'var(--accent-gold)';
                            
                            gameListLabel.innerText = data.has_voted ? '🔒 Vote cast! Waiting for results...' : (data.is_alive ? 'Cast Your Vote to Lynch:' : 'Squad Roster (You are eliminated):');

                            gamePlayerList.innerHTML = data.players.map(p => {
                                const isMe = (p.id === data.my_id);
                                const canVote = (data.is_alive && p.is_alive);
                                const isVoteTarget = (data.my_vote_id === p.id);

                                let actionBtn = '';
                                if (canVote) {
                                    if (isVoteTarget) {
                                        actionBtn = `<button class="btn-action btn-voted" disabled><i data-lucide="check" size="14"></i> Voted ✓</button>`;
                                    } else {
                                        actionBtn = `<button class="btn-action" onclick="submitDayVote(${p.id})"><i data-lucide="vote" size="14"></i> Vote</button>`;
                                    }
                                }

                                const statusIcon = p.is_alive ? '<i data-lucide="shield" size="18" style="color: #38bdf8;"></i>' : '<i data-lucide="skull" size="18" style="color: var(--accent-red);"></i>';

                                return `
                                    <li class="player-item ${p.is_alive ? '' : 'dead'}">
                                        <span class="player-info-wrap">${statusIcon} ${p.nickname} ${isMe ? '(You)' : ''}</span>
                                        ${actionBtn}
                                    </li>
                                `;
                            }).join('');
                            lucide.createIcons();
                        } else if (data.room_status === 'ended') {
                            phaseText.innerHTML = '<i data-lucide="trophy" size="16" style="vertical-align: middle;"></i> Match Concluded';
                            phaseText.style.color = '#38bdf8';
                            gameListLabel.innerText = 'Final Squad Roster:';
                            backMenuBtn.classList.remove('hidden');

                            gamePlayerList.innerHTML = data.players.map(p => {
                                const statusIcon = p.is_alive ? '<i data-lucide="shield" size="18" style="color: #38bdf8;"></i>' : '<i data-lucide="skull" size="18" style="color: var(--accent-red);"></i>';
                                return `
                                    <li class="player-item ${p.is_alive ? '' : 'dead'}">
                                        <span class="player-info-wrap">${statusIcon} ${p.nickname} — Role: <strong>${p.role}</strong></span>
                                    </li>
                                `;
                            }).join('');
                            lucide.createIcons();
                        }
                    }
                }
            }, 1500);
        }
    </script>
</body>
</html>
