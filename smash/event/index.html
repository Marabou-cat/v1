<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Events · Super Brawl</title>
<style>
  :root{
    --a:#7fd0ff; --a2:#eaf9ff;           /* 每个活动会覆盖这两个强调色 */
    --ink:#eaf4ff; --dim:#9fb3c9;
    --panel:rgba(10,16,28,.72); --line:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); background:#060a12; overflow:hidden;
  }
  /* ================= 背景（不要太平淡）：极光 + 光束 + 网格 + 星点 + 暗角 ================= */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
      radial-gradient(130% 90% at 12% -14%, rgba(30,74,124,.85) 0%, rgba(10,18,32,0) 58%),
      radial-gradient(90% 80% at 102% -6%, rgba(72,40,108,.75) 0%, rgba(10,18,32,0) 60%),
      linear-gradient(180deg,#0a1322 0%,#070c16 55%,#04070d 100%)}
  .bg .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;
    background:radial-gradient(circle,var(--a) 0%,rgba(0,0,0,0) 70%);transition:background .6s ease}
  .bg .g1{width:52vw;height:52vw;left:-12vw;top:-16vw;animation:drift1 26s ease-in-out infinite alternate}
  .bg .g2{width:46vw;height:46vw;right:-10vw;top:-8vw;background:radial-gradient(circle,var(--a2) 0%,rgba(0,0,0,0) 70%);
    opacity:.28;animation:drift2 31s ease-in-out infinite alternate}
  .bg .g3{width:60vw;height:60vw;left:28%;bottom:-34vw;opacity:.32;animation:drift1 38s ease-in-out infinite alternate-reverse}
  @keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vw,3vw,0) scale(1.12)}}
  @keyframes drift2{from{transform:translate3d(0,0,0) scale(1.06)}to{transform:translate3d(-5vw,4vw,0) scale(.96)}}
  .bg .rays{position:absolute;inset:-40% -20%;opacity:.10;
    background:repeating-conic-gradient(from 0deg at 70% 10%, rgba(255,255,255,.85) 0deg 1.1deg, transparent 1.1deg 9deg);
    animation:spin 120s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bg .grid{position:absolute;inset:0;opacity:.16;
    background-image:linear-gradient(rgba(140,200,255,.16) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(140,200,255,.16) 1px,transparent 1px);
    background-size:46px 46px;mask-image:radial-gradient(80% 70% at 50% 30%,#000 0%,transparent 75%)}
  .bg .stars{position:absolute;inset:0;opacity:.7;
    background-image:
      radial-gradient(1.6px 1.6px at 14% 22%,#fff,transparent 60%),
      radial-gradient(1.4px 1.4px at 72% 14%,#fff,transparent 60%),
      radial-gradient(1.2px 1.2px at 38% 66%,#fff,transparent 60%),
      radial-gradient(1.6px 1.6px at 58% 84%,#fff,transparent 60%),
      radial-gradient(1.2px 1.2px at 88% 52%,#fff,transparent 60%),
      radial-gradient(1.2px 1.2px at 26% 88%,#fff,transparent 60%),
      radial-gradient(1.4px 1.4px at 46% 34%,#fff,transparent 60%);
    animation:twinkle 5.5s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.35}to{opacity:.85}}
  .bg .vig{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 40%,transparent 40%,rgba(0,0,0,.55) 100%)}

  /* ================= 布局：左内容 / 右侧活动栏 ================= */
  .app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 18px 6px}
  .brand{font:900 13px/1 inherit;letter-spacing:3.6px;color:var(--a2)}
  .brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--a);
    margin-right:9px;vertical-align:1px;box-shadow:0 0 12px var(--a)}
  .topbar .spacer{flex:1}
  .topbar .hint{font:800 10px/1 inherit;letter-spacing:1.4px;color:var(--dim);opacity:.85}
  .shell{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:14px;padding:4px 14px 14px;min-height:0}

  /* ---------------- 主舞台 ---------------- */
  .stage{min-height:0;overflow:auto;border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(165deg,rgba(16,26,44,.86),rgba(8,13,24,.90));
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    display:flex;flex-direction:column}
  .stage::-webkit-scrollbar{width:8px}
  .stage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}

  /* 封面：每个活动一套纯 CSS 画面 */
  .cover{position:relative;height:min(33vh,262px);min-height:176px;flex:0 0 auto;overflow:hidden;
    border-radius:18px 18px 0 0;isolation:isolate}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(6,10,18,.92) 100%)}
  .cover .art{position:absolute;inset:0}
  .cover .kicker{position:absolute;left:18px;top:16px;z-index:3;display:flex;gap:8px;align-items:center}
  .cover .pill{font:900 9.5px/1 inherit;letter-spacing:1.6px;padding:6px 10px;border-radius:999px;
    background:rgba(6,10,18,.62);border:1px solid rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px)}
  .cover .pill.hot{background:linear-gradient(180deg,#ffd166,#ff9f1c);color:#2a1400;border-color:transparent;
    box-shadow:0 6px 18px rgba(255,159,28,.45)}
  .cover .bigReward{position:absolute;right:16px;bottom:14px;z-index:3;text-align:right}
  .cover .bigReward b{display:block;font:900 clamp(22px,3.4vw,34px)/1 inherit;letter-spacing:.5px;
    color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.75)}
  .cover .bigReward span{display:block;margin-top:5px;font:900 9.5px/1 inherit;letter-spacing:2px;color:var(--a2);opacity:.92}

  /* A. Blizzard：冰雕（水晶棱角）+ 冰锥 + 飘雪 */
  .art.ice{background:
      radial-gradient(70% 90% at 24% 16%,rgba(150,225,255,.45),transparent 62%),
      linear-gradient(160deg,#12314c,#0a1a2c 62%,#07121f)}
  .art.ice .statue{position:absolute;left:7%;bottom:-6%;width:168px;height:206px;
    background:linear-gradient(168deg,#f2fdff 0%,#bfe8ff 26%,#77b8d8 52%,#3d7ea6 78%,#1b4a68 100%);
    clip-path:polygon(50% 0%,70% 7%,84% 24%,97% 42%,100% 100%,0% 100%,3% 42%,16% 24%,30% 7%);
    box-shadow:inset -14px -18px 34px rgba(6,32,54,.65), 0 20px 46px rgba(20,80,120,.45)}
  .art.ice .statue::before{content:"";position:absolute;left:22%;top:6%;width:14%;height:74%;
    background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));transform:skewX(-8deg);opacity:.7}
  .art.ice .statue::after{content:"";position:absolute;left:64%;top:12%;width:9%;height:56%;
    background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));transform:skewX(8deg)}
  .art.ice .shard{position:absolute;background:linear-gradient(180deg,#eafaff,#9fd8ff);
    clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.95;filter:drop-shadow(0 6px 14px rgba(120,220,255,.35))}
  .art.ice .h1{width:40px;height:64px;left:4%;bottom:22%;transform:rotate(-14deg)}
  .art.ice .h2{width:28px;height:46px;left:40%;bottom:14%;transform:rotate(10deg)}
  .art.ice .h3{width:22px;height:38px;left:30%;bottom:4%;transform:rotate(-4deg);opacity:.8}
  .art.ice .eye{position:absolute;left:calc(7% + 56px);bottom:120px;width:12px;height:12px;border-radius:50%;
    background:#eaffff;box-shadow:0 0 16px #bff0ff}
  .art.ice .eye.r{left:calc(7% + 94px)}
  .art.ice .spark{position:absolute;width:2px;height:26px;background:linear-gradient(180deg,transparent,#dff4ff,transparent);opacity:.8}
  .art.ice .s1{left:32%;top:8%;animation:snowfall 7s linear infinite}
  .art.ice .s2{left:52%;top:2%;animation:snowfall 9.5s linear infinite}
  .art.ice .s3{left:68%;top:14%;animation:snowfall 6s linear infinite}
  @keyframes snowfall{from{transform:translateY(-30px)}to{transform:translateY(280px)}}

  /* B. Summon Rush：宝石堆 + 放射光 */
  .art.gem{background:
      radial-gradient(60% 80% at 30% 20%,rgba(190,150,255,.42),transparent 60%),
      linear-gradient(160deg,#2a1a4a,#170f2c 60%,#0b0817)}
  .art.gem .ray{position:absolute;inset:-30% -10%;opacity:.22;
    background:repeating-conic-gradient(from 10deg at 45% 60%, rgba(255,214,106,.9) 0deg 2deg, transparent 2deg 16deg);
    animation:spin 60s linear infinite}
  .art.gem .gem{position:absolute;clip-path:polygon(50% 0,100% 34%,50% 100%,0 34%);
    background:linear-gradient(160deg,#e6f7ff,#9fdcff 40%,#4aa6e8 78%,#2a6fae);
    box-shadow:0 12px 30px rgba(80,160,255,.45)}
  .art.gem .gm1{width:96px;height:104px;left:16%;bottom:6%}
  .art.gem .gm2{width:70px;height:78px;left:36%;bottom:2%;transform:rotate(-12deg);
    background:linear-gradient(160deg,#ffe9b8,#ffd166 44%,#e09a20 80%)}
  .art.gem .gm3{width:54px;height:60px;left:9%;bottom:0;transform:rotate(10deg);opacity:.85}
  .art.gem .gm1::after,.art.gem .gm2::after{content:"";position:absolute;left:18%;top:8%;width:26%;height:44%;
    background:linear-gradient(180deg,rgba(255,255,255,.85),transparent);transform:skewX(-12deg)}
  .art.gem .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;
    box-shadow:0 0 12px #fff,0 0 26px #ffd166;animation:pop 2.6s ease-in-out infinite}
  .art.gem .sp1{left:30%;top:24%}.art.gem .sp2{right:26%;top:34%;animation-delay:.7s}
  .art.gem .sp3{left:52%;top:12%;animation-delay:1.3s}
  @keyframes pop{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1)}}

  /* C. Penguin：Q 版企鹅脸（和游戏里的皮肤同一套五官） */
  .art.peng{background:
      radial-gradient(65% 85% at 26% 16%,rgba(140,255,214,.34),transparent 62%),
      linear-gradient(160deg,#0f2c3a,#0a1a26 62%,#060f16)}
  .art.peng .aurora{position:absolute;inset:-10%;opacity:.5;
    background:linear-gradient(115deg,transparent 30%,rgba(140,255,214,.55) 46%,rgba(120,190,255,.45) 56%,transparent 72%);
    filter:blur(14px);animation:sway 9s ease-in-out infinite alternate}
  @keyframes sway{from{transform:translateX(-6%) rotate(-2deg)}to{transform:translateX(6%) rotate(2deg)}}
  .art.peng .pscene{position:absolute;left:6%;bottom:-15%;width:238px;height:238px}
  .art.peng .pbody{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 34% 26%,#3a5673,#1b2a3c 58%,#0e151f 100%);
    box-shadow:0 22px 46px rgba(0,0,0,.55), inset -12px -16px 40px rgba(0,0,0,.55), inset 16px 10px 44px rgba(140,255,214,.12)}
  .art.peng .pbelly{position:absolute;left:13%;top:16%;right:13%;bottom:4%;border-radius:50%;
    background:linear-gradient(180deg,#ffffff,#e8f4fa 72%,#d7e7f2);
    box-shadow:inset 0 -14px 26px rgba(140,180,210,.35)}
  .art.peng .peye{position:absolute;top:33%;width:17%;height:19.5%;border-radius:50%;background:#0b1018}
  .art.peng .peye.l{left:22%}
  .art.peng .peye.r{left:55%}
  .art.peng .peye i{position:absolute;left:22%;top:18%;width:34%;height:34%;border-radius:50%;background:#fff;
    box-shadow:0 0 10px rgba(255,255,255,.85)}
  .art.peng .peye i.s{left:60%;top:56%;width:17%;height:17%;opacity:.9}
  .art.peng .pbeak{position:absolute;left:41%;top:39.5%;width:18%;height:10%;border-radius:50%;
    background:linear-gradient(180deg,#ffb43a 55%,#e8891f 56%);
    box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .art.peng .flake{position:absolute;color:#bff7ff;font:900 13px/1 inherit;opacity:.75;animation:snowfall 8s linear infinite}

  /* 正文 */
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
  .title{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .title h1{margin:0;font:900 clamp(21px,3vw,29px)/1.05 inherit;letter-spacing:.8px}
  .title .sub{font:800 10.5px/1 inherit;letter-spacing:2px;color:var(--a);padding-bottom:3px}
  .desc{margin:0;font-size:12.8px;line-height:1.6;color:#c2d3e4;max-width:62ch}

  /* 奖励卡：明摆着 */
  .rewardRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  .rw{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
    background:linear-gradient(135deg,rgba(255,214,106,.16),rgba(255,214,106,.03));
    border:1px solid rgba(255,214,106,.42)}
  .rw .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
    background:rgba(255,214,106,.16);border:1px solid rgba(255,214,106,.4);font-size:19px;line-height:1}
  .rw .t b{display:block;font:900 13.5px/1.2 inherit;color:#ffe9a8}
  .rw .t span{display:block;font-size:10.5px;letter-spacing:1.1px;color:#c9b98a;margin-top:3px}
  .rw.done{background:rgba(46,204,113,.12);border-color:rgba(46,204,113,.45)}
  .rw.done .t b{color:#8ff0b4}
  .rw.done .ic{background:rgba(46,204,113,.16);border-color:rgba(46,204,113,.45)}

  .steps{display:grid;gap:7px}
  .step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);font-size:12.4px;color:#cfe0f2}
  .step .n{width:20px;height:20px;flex:0 0 20px;border-radius:50%;display:grid;place-items:center;font-size:11px;
    font-weight:900;background:rgba(127,208,255,.18);color:var(--a);border:1px solid rgba(127,208,255,.45)}
  .step.done{opacity:.6}.step.done .n{background:#2ecc71;border-color:#2ecc71;color:#062}

  .cta{display:flex;gap:10px;align-items:center;margin-top:2px}
  /* ---------- GEM QUESTS：每日/累计进度条 + 任务行 ---------- */
  .caps{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .cap{padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10)}
  .cap b{display:flex;justify-content:space-between;gap:8px;font:900 10.5px/1 inherit;letter-spacing:1.2px;color:#dfe9f5}
  .cap b i{font-style:normal;color:var(--a)}
  .cap .track{height:7px;border-radius:4px;background:rgba(255,255,255,.10);margin-top:8px;overflow:hidden}
  .cap .track u{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--a2),var(--a));transition:width .3s}
  .cap small{display:block;margin-top:6px;font-size:9.5px;letter-spacing:.7px;color:#8fa6bd}
  .qt{display:flex;flex-direction:column;gap:7px}
  .qt h4{margin:6px 2px 0;font:900 9.5px/1 inherit;letter-spacing:2px;color:#8fa6bd}
  .qrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
  .qrow.ready{border-color:rgba(255,214,106,.55);background:linear-gradient(90deg,rgba(255,214,106,.13),rgba(255,214,106,.02))}
  .qrow.done{opacity:.5}
  .qrow .qi{width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:grid;place-items:center;font-size:14px;
    background:rgba(127,208,255,.14);border:1px solid rgba(127,208,255,.32);color:var(--a)}
  .qrow .qm{flex:1;min-width:0}
  .qrow .qm b{display:block;font:800 12.2px/1.3 inherit}
  .qrow .qm .pg{display:flex;align-items:center;gap:7px;margin-top:5px}
  .qrow .qm .pg span{font:800 9.5px/1 inherit;letter-spacing:.6px;color:#9fb3c9;white-space:nowrap}
  .qrow .qm .track{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.10);overflow:hidden}
  .qrow .qm .track u{display:block;height:100%;background:linear-gradient(90deg,var(--a2),var(--a))}
  .qrow .rew{font:900 11.5px/1 inherit;color:#ffe9a8;white-space:nowrap}
  .qrow button{border:0;border-radius:9px;padding:8px 11px;font:900 10.5px/1 inherit;letter-spacing:.7px;cursor:pointer;
    background:linear-gradient(180deg,#ffe066,#ff9f1c);color:#2a1400;white-space:nowrap}
  .qrow button[disabled]{background:rgba(255,255,255,.10);color:#8fa6bd;cursor:default}
  .btn{flex:1;padding:14px 18px;border:0;border-radius:14px;font:900 13.5px/1 inherit;letter-spacing:1.3px;
    cursor:pointer;color:#06202e;background:linear-gradient(180deg,var(--a2),var(--a));
    box-shadow:0 10px 26px rgba(60,160,220,.3);transition:transform .08s,filter .15s}
  .btn:active{transform:translateY(1px) scale(.995)}
  .btn.ghost{background:rgba(255,255,255,.08);color:#dceaf7;border:1px solid rgba(255,255,255,.18);box-shadow:none}
  .btn[disabled]{filter:grayscale(.55) brightness(.85);cursor:default;box-shadow:none}
  .state{font-size:12px;min-height:16px;color:var(--a2);opacity:.9}
  .badge{display:inline-block;font-size:10px;letter-spacing:1.6px;padding:3px 8px;border-radius:6px;
    background:rgba(46,204,113,.16);border:1px solid rgba(46,204,113,.45);color:#7ce8a4}
  .foot{font-size:10.5px;line-height:1.6;color:#7b90a6}

  /* ---------------- 右侧活动栏 ---------------- */
  .rail{min-height:0;display:flex;flex-direction:column;gap:9px}
  .rail h3{margin:2px 4px 0;font:900 10px/1 inherit;letter-spacing:2.4px;color:var(--dim)}
  .rail .list{display:flex;flex-direction:column;gap:9px;overflow:auto;padding-right:2px}
  .rail .list::-webkit-scrollbar{width:6px}
  .rail .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  .ev{position:relative;display:flex;gap:10px;padding:9px;border-radius:14px;cursor:pointer;text-align:left;
    background:rgba(12,19,32,.78);border:1px solid rgba(255,255,255,.10);color:inherit;font:inherit;
    transition:transform .1s,border-color .18s,background .18s}
  .ev:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.26)}
  .ev.on{border-color:var(--a);background:rgba(24,38,60,.9);box-shadow:0 0 0 2px rgba(127,208,255,.16)}
  .ev .thumb{width:54px;height:54px;flex:0 0 54px;border-radius:10px;overflow:hidden;position:relative}
  .ev .thumb .art{position:absolute;inset:0;transform:scale(.9)}
  .ev .mi{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding-right:34px}
  .ev .mi b{font:900 11.5px/1.25 inherit;letter-spacing:.4px;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .ev .mi span{font:800 9.5px/1 inherit;letter-spacing:1px;color:#ffd166;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .mi u{font:800 9px/1 inherit;letter-spacing:1.2px;text-decoration:none;color:#8fa6bd}
  .ev .flag{position:absolute;right:7px;top:7px;font:900 8px/1 inherit;letter-spacing:1.2px;padding:3px 6px;border-radius:5px}
  .ev .flag.new{background:linear-gradient(180deg,#ffd166,#ff9f1c);color:#2a1400}
  .ev .flag.done{background:rgba(46,204,113,.2);border:1px solid rgba(46,204,113,.5);color:#8ff0b4}

  /* ---------------- 手机 / 窄屏：活动栏挪到顶部横滑 ---------------- */
  @media (max-width:820px){
    .shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:10px}
    .rail{order:-1}
    .rail .list{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding-bottom:3px}
    .ev{min-width:186px;flex:0 0 auto}
    .cover{height:min(26vh,210px);min-height:150px}
    .topbar .hint{display:none}
  }
</style>
</head>
<body data-ev="gemrush">
<div class="bg" aria-hidden="true">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <div class="rays"></div><div class="grid"></div><div class="stars"></div><div class="vig"></div>
</div>

<div class="app">
  <div class="topbar">
    <div class="brand"><i></i>EVENTS</div>
    <div class="spacer"></div>
    <div class="hint" id="hint">PICK AN EVENT ON THE RIGHT →</div>
  </div>

  <div class="shell">
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside class="rail">
      <h3>EVENT LIST</h3>
      <div class="list" id="list"></div>
    </aside>
  </div>
</div>

<script>
(function () {
  var inFrame = false;
  try { inFrame = window.parent && window.parent !== window; } catch (e) {}

  /* ================= 活动表（想加新活动只改这里 + COVERS） ================= */
  var EVENTS = [
    { id:'gemquests', name:'GEM QUESTS', sub:'DAILY TASKS · UP TO 4,000', theme:'gem', tag:'NEW', tasks:true,
      reward:{ icon:'◆', title:'UP TO 4,000 GEMS', note:'MAX 500 PER DAY' },
      desc:'Do the tasks, take the gems. Six daily tasks are worth <b>500 gems a day</b>, and the milestone list keeps paying until you have collected <b>4,000 in total</b>.',
      steps:[ 'Finish tasks in game — progress updates after every match', 'Claim here before the day rolls over (daily tasks reset at 00:00)' ],
      cta:'CLAIM ALL READY' },
    { id:'penguin', name:'PENGUIN DROP', sub:'SKIN · SMILEY', theme:'peng', tag:'NEW',
      reward:{ icon:'◕', title:'PENGUIN SKIN', note:'FOR SMILEY · INSTANT' },
      desc:'A round little penguin waddles in. Claim the <b>Penguin skin</b> for Smiley — big glossy eyes, an oval beak, and a belly that fits the ball perfectly.',
      steps:[ 'Claim the skin', 'Equip it: SKIN button under your fighter' ],
      cta:'CLAIM PENGUIN SKIN', claimId:'penguin' },
    { id:'blizzard', name:'BLIZZARD RETURNS', sub:'FIGHTER · EMAIL REWARD', theme:'ice', tag:'LIMITED',
      reward:{ icon:'❄', title:'BLIZZARD', note:'FIGHTER · NOT IN SHOP' },
      desc:'A rock statue with a frozen core. Every hit stacks <b>ICE</b>; five stacks freeze a foe solid. Never sold — the only way in is binding an email.',
      steps:[ 'Bind an email in Settings (6-digit code)', 'Claim Blizzard — permanently added to your roster' ],
      cta:'BIND EMAIL', claimId:'blizzard' }
  ];

  /* 封面（纯 CSS 画面，不用任何图片请求） */
  var COVERS = {
    ice: '<div class="art ice"><div class="statue"></div><div class="shard h1"></div><div class="shard h2"></div>'
       + '<div class="shard h3"></div><div class="eye"></div><div class="eye r"></div>'
       + '<div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div></div>',
    gem: '<div class="art gem"><div class="ray"></div><div class="gem gm1"></div><div class="gem gm3"></div>'
       + '<div class="gem gm2"></div><div class="spark sp1"></div><div class="spark sp2"></div><div class="spark sp3"></div></div>',
    peng:'<div class="art peng"><div class="aurora"></div>'
       + '<div class="pscene"><div class="pbody"></div><div class="pbelly"></div>'
       + '<div class="peye l"><i></i><i class="s"></i></div><div class="peye r"><i></i><i class="s"></i></div>'
       + '<div class="pbeak"></div></div>'
       + '<div class="flake" style="left:56%;top:8%">❄</div>'
       + '<div class="flake" style="left:74%;top:34%;animation-delay:1.4s">❄</div>'
       + '<div class="flake" style="left:48%;top:58%;animation-delay:2.6s">❄</div></div>'
  };
  var THEMES = {
    ice:{ a:'#8fd8ff', a2:'#dff4ff' },
    gem:{ a:'#b98cff', a2:'#ffe9b8' },
    peng:{ a:'#8affd6', a2:'#d8fff2' }
  };

  var st = { ready:false, email:false, owns:false, hasSkin:false, gems:0, claims:{}, quests:null };
  var cur = EVENTS[0].id;
  var stage = document.getElementById('stage');
  var listEl = document.getElementById('list');
  var hintEl = document.getElementById('hint');

  function evById(id){ for (var i=0;i<EVENTS.length;i++) if (EVENTS[i].id===id) return EVENTS[i]; return EVENTS[0]; }
  function questRows(){ return (st.quests && st.quests.rows) || []; }
  function anyReady(){ return questRows().some(function(r){ return r.ready; }); }
  function claimed(e){
    if (e.tasks) { var rows = questRows(); return rows.length > 0 && rows.every(function(r){ return r.claimed; }); }
    if (e.claimId === 'blizzard') return !!st.owns;
    return !!(st.claims && st.claims[e.claimId]);
  }
  function ready(e){
    if (e.tasks) return !!st.quests;
    if (e.claimId === 'blizzard') return !!st.email;
    return true;
  }
  function post(msg){ if (inFrame) { try { window.parent.postMessage(msg, '*'); } catch (err) {} } }

  function setTheme(e){
    var t = THEMES[e.theme] || THEMES.ice;
    var r = document.documentElement.style;
    r.setProperty('--a', t.a); r.setProperty('--a2', t.a2);
    document.body.dataset.ev = e.theme;
  }

  function renderRail(){
    var cappedNow = !!st.quests && (st.quests.dayLeft <= 0 || st.quests.totalLeft <= 0);
    listEl.innerHTML = EVENTS.map(function(e){
      var on = (e.id === cur), done = claimed(e);
      var reward = (e.tasks && st.quests)
        ? ('◆ ' + (st.quests.total | 0) + ' / ' + (st.quests.totalCap | 0) + ' GEMS')
        : e.reward.title;
      var flag = done ? '<span class="flag done">DONE</span>'
               : (e.tasks && anyReady() && !cappedNow) ? '<span class="flag new">CLAIM</span>'
               : (e.tag === 'NEW' ? '<span class="flag new">NEW</span>' : '');
      return '<button class="ev' + (on ? ' on' : '') + '" data-id="' + e.id + '">'
        + '<span class="thumb"><span class="art ' + (e.theme === 'gem' ? 'gem' : e.theme === 'peng' ? 'peng' : 'ice') + '">'
        + (e.theme === 'gem' ? '<i class="gem gm1" style="width:30px;height:34px;left:10px;bottom:6px;position:absolute;clip-path:polygon(50% 0,100% 34%,50% 100%,0 34%);background:linear-gradient(160deg,#e6f7ff,#9fdcff 40%,#4aa6e8)"></i><i class="gem gm2" style="width:20px;height:24px;left:28px;bottom:2px;position:absolute;clip-path:polygon(50% 0,100% 34%,50% 100%,0 34%);background:linear-gradient(160deg,#ffe9b8,#ffd166)"></i>'
          : e.theme === 'peng' ? '<i style="position:absolute;inset:0;background:linear-gradient(160deg,#0f2c3a,#0a1a26)"></i><i style="position:absolute;left:12px;top:14px;width:26px;height:26px;border-radius:50%;background:#fff"></i><i style="position:absolute;left:18px;top:22px;width:6px;height:7px;border-radius:50%;background:#0b1018"></i><i style="position:absolute;left:27px;top:22px;width:6px;height:7px;border-radius:50%;background:#0b1018"></i><i style="position:absolute;left:24px;top:31px;width:9px;height:6px;border-radius:50%;background:#ffb43a"></i>'
          : '<i style="position:absolute;inset:0;background:linear-gradient(160deg,#12314c,#0a1a2c)"></i><i style="position:absolute;left:16px;top:12px;width:22px;height:32px;border-radius:12px 12px 6px 6px;background:linear-gradient(165deg,#dff4ff,#8fc9e9 45%,#3d7ea6)"></i>')
        + '</span></span>'
        + '<span class="mi"><b>' + e.name + '</b><span>' + reward + '</span><u>' + e.sub + '</u></span>'
        + flag
        + '</button>';
    }).join('');
  }

  function renderStage(){
    var e = evById(cur);
    setTheme(e);
    if (e.tasks) { renderQuests(e); return; }        // 宝石任务页有自己的一套版式
    var done = claimed(e), rd = ready(e);
    var rewardCls = done ? 'rw done' : 'rw';
    var steps = e.steps.map(function(s, i){
      var cls = 'step' + (done ? ' done' : '');
      var num = done ? '✓' : (i + 1);
      return '<div class="' + cls + '"><span class="n">' + num + '</span><span>' + s + '</span></div>';
    }).join('');
    var ctaTxt, disabled = false, ghost = false, note;
    if (done) { ctaTxt = 'ALREADY CLAIMED'; disabled = true; ghost = true; note = 'Reward is in your account.'; }
    else if (!st.ready) { ctaTxt = 'LOADING…'; disabled = true; note = 'Connecting to your account…'; }
    else if (!rd) { ctaTxt = e.cta; note = 'No email bound yet — that is the only requirement.'; }
    else if (e.claimId === 'blizzard') { ctaTxt = 'CLAIM BLIZZARD'; note = 'Email bound ✓ — claim your reward.'; }
    else { ctaTxt = e.cta; note = 'One claim per account · added instantly.'; }

    stage.innerHTML =
      '<div class="cover">' + (COVERS[e.theme] || COVERS.ice)
      + '<div class="kicker"><span class="pill hot">' + (e.tag === 'NEW' ? 'NEW EVENT' : e.tag) + '</span>'
      + '<span class="pill">' + e.sub + '</span></div>'
      + '<div class="bigReward"><b>' + e.reward.title + '</b><span>REWARD · ' + e.reward.note + '</span></div>'
      + '</div>'
      + '<div class="body">'
      + '<div class="title"><h1>' + e.name + '</h1><div class="sub">' + e.sub + '</div></div>'
      + '<p class="desc">' + e.desc + '</p>'
      + '<div class="rewardRow"><div class="' + rewardCls + '"><div class="ic">' + e.reward.icon + '</div>'
      + '<div class="t"><b>' + e.reward.title + '</b><span>' + (done ? 'CLAIMED' : e.reward.note) + '</span></div></div></div>'
      + '<div class="steps">' + steps + '</div>'
      + '<div class="cta"><button class="btn' + (ghost ? ' ghost' : '') + '" id="mainBtn"' + (disabled ? ' disabled' : '') + '>' + ctaTxt + '</button></div>'
      + '<div class="state" id="state">' + (done ? 'Blizzard is in your roster. <span class="badge">CLAIMED</span>' : note) + '</div>'
      + '<div class="foot">Trophies, coins, gems and unlocked fighters are stored on the server. Binding an email also lets you play the same account on another device.</div>'
      + '</div>';

    var btn = document.getElementById('mainBtn');
    btn.onclick = function () {
      if (!st.ready || claimed(e)) return;
      if (!ready(e)) { post({ type:'sb-event-bind' }); return; }
      post({ type:'sb-event-claim', id: e.claimId });
      var s = document.getElementById('state'); if (s) s.textContent = 'Claiming…';
      setTimeout(function(){ post({ type:'sb-event-state' }); }, 700);
    };
  }

  function coverFor(e){
    return '<div class="cover">' + (COVERS[e.theme] || COVERS.ice)
      + '<div class="kicker"><span class="pill hot">' + (e.tag === 'NEW' ? 'NEW EVENT' : e.tag) + '</span>'
      + '<span class="pill">' + e.sub + '</span></div>'
      + '<div class="bigReward"><b>' + e.reward.title + '</b><span>REWARD · ' + e.reward.note + '</span></div>'
      + '</div>';
  }

  /* ★ 宝石任务页：今日进度 / 累计进度 + 每日任务 6 条 + 一次性里程碑 */
  function claimTask(id){
    post({ type:'sb-event-claim', id:'gemtask', task:id });
    var s = document.getElementById('state'); if (s) s.textContent = 'Claiming…';
    setTimeout(function(){ post({ type:'sb-event-state' }); }, 700);
  }
  function renderQuests(e){
    var q = st.quests, rows = questRows();
    var daily = rows.filter(function(r){ return !r.once; });
    var once  = rows.filter(function(r){ return r.once; });
    var capped = !!q && (q.dayLeft <= 0 || q.totalLeft <= 0);   // 今日/累计上限已满
    function rowHtml(r){
      var pct = r.goal ? Math.min(100, Math.round(r.prog / r.goal * 100)) : 0;
      var cls = 'qrow' + (r.claimed ? ' done' : (r.ready && !capped ? ' ready' : ''));
      var btn = r.claimed ? '<button disabled>✓ DONE</button>'
              : (r.ready ? (capped ? '<button disabled>CAP</button>' : '<button data-q="' + r.id + '">CLAIM</button>')
                         : '<button disabled>' + r.prog + '/' + r.goal + '</button>');
      return '<div class="' + cls + '">'
        + '<div class="qi">' + (r.once ? '★' : '◆') + '</div>'
        + '<div class="qm"><b>' + r.label + '</b><div class="pg">'
        + '<div class="track"><u style="width:' + pct + '%"></u></div><span>' + r.prog + ' / ' + r.goal + '</span></div></div>'
        + '<div class="rew">+' + r.gems + ' ◆</div>' + btn + '</div>';
    }
    var dayPct = q ? Math.min(100, Math.round(q.dayGems / q.dayCap * 100)) : 0;
    var totPct = q ? Math.min(100, Math.round(q.total / q.totalCap * 100)) : 0;
    var readyCount = rows.filter(function(r){ return r.ready; }).length;
    stage.innerHTML = coverFor(e)
      + '<div class="body">'
      + '<div class="title"><h1>' + e.name + '</h1><div class="sub">' + e.sub + '</div></div>'
      + '<p class="desc">' + e.desc + '</p>'
      + (q ? '<div class="caps">'
            + '<div class="cap"><b>TODAY<i>' + q.dayGems + ' / ' + q.dayCap + '</i></b>'
            + '<div class="track"><u style="width:' + dayPct + '%"></u></div>'
            + '<small>RESETS AT 00:00 · ' + q.dayLeft + ' GEMS LEFT TODAY</small></div>'
            + '<div class="cap"><b>TOTAL<i>' + q.total + ' / ' + q.totalCap + '</i></b>'
            + '<div class="track"><u style="width:' + totPct + '%"></u></div>'
            + '<small>' + q.totalLeft + ' GEMS STILL AVAILABLE</small></div>'
            + '</div>' : '<div class="state">Connecting to your account…</div>')
      + (daily.length ? '<div class="qt"><h4>DAILY TASKS · RESET EVERY DAY</h4>' + daily.map(rowHtml).join('') + '</div>' : '')
      + (once.length ? '<div class="qt"><h4>MILESTONES · ONE TIME ONLY</h4>' + once.map(rowHtml).join('') + '</div>' : '')
      + '<div class="cta"><button class="btn" id="claimAll"' + (readyCount && !capped ? '' : ' disabled') + '>'
      + (capped ? 'CAP REACHED · COME BACK TOMORROW'
                : (readyCount ? ('CLAIM ALL READY · ' + readyCount) : 'NOTHING READY YET'))
      + '</button></div>'
      + '<div class="state" id="state">Progress is tracked in game — play matches, win, knock out, summon, play online.</div>'
      + '</div>';
    var btns = stage.querySelectorAll('[data-q]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = function(){ claimTask(this.getAttribute('data-q')); };
    }
    var all = document.getElementById('claimAll');
    if (all) all.onclick = function(){
      var ids = rows.filter(function(r){ return r.ready; }).map(function(r){ return r.id; });
      ids.forEach(function(id, k){ setTimeout(function(){ claimTask(id); }, k * 300); });
    };
  }

  function renderAll(){ renderRail(); renderStage(); }

  listEl.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.ev') : null;
    if (!b) return;
    cur = b.dataset.id;
    renderAll();
  });

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || typeof d !== 'object' || d.type !== 'sb-state') return;
    st.email = !!d.email;
    st.owns = !!d.owns;
    st.hasSkin = !!d.hasSkin;
    st.gems = Number(d.gems) || 0;
    st.claims = d.claims || {};
    if (d.quests) st.quests = d.quests;
    st.ready = true;
    renderAll();
  });

  /* 独立打开（不是嵌在游戏里）时给说明，而不是空白 */
  if (!inFrame) {
    st.ready = true;
    hintEl.textContent = 'OPEN THIS FROM INSIDE THE GAME (EVENTS BUTTON)';
    renderAll();
    setTimeout(function(){
      var b = document.getElementById('mainBtn');
      if (b) { b.disabled = true; b.textContent = 'OPEN IN GAME'; }
      var s = document.getElementById('state');
      if (s) s.textContent = 'This page only works inside the game — open it with the EVENTS button in the lobby.';
    }, 0);
  } else {
    renderAll();
    post({ type:'sb-event-state' });
    setTimeout(function(){ if (!st.ready) { st.ready = true; renderAll(); } }, 1400);
  }
})();
</script>
</body>
</html>
