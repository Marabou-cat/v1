<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<title>小游戏大厅 · 689 款</title>
<style>
  :root{
    --bg:#07070d; --panel:#101019; --panel2:#16161f; --line:#242433;
    --tx:#e9e9f2; --dim:#8b8b9e; --acc:#39e0ff; --acc2:#a855f7;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    overscroll-behavior-y:contain}
  body{padding-bottom:calc(46px + var(--safe-b))}
  body.embedded{padding-top:calc(44px + var(--safe-t))}
  a{color:var(--acc)}

  /* ---------- top bar ---------- */
  #bar{position:sticky;top:0;z-index:20;height:58px;flex:0 0 auto;
    padding:8px 12px;display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(7,7,13,.98),rgba(7,7,13,.9));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line)}
  /* 门户的 HUD（✕ / 聊天 / 全屏）固定在左上角，嵌入时把自己的栏让到它下面 */
  body.embedded #bar{top:calc(44px + var(--safe-t))}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--tx);
    font:inherit;font-size:13px;font-weight:600;padding:8px 11px;border-radius:10px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;line-height:1;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent}
  .btn.acc{border-color:rgba(57,224,255,.45);color:var(--acc)}
  .ttl{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
  .ttl b{font-size:16px;letter-spacing:.3px;white-space:nowrap}
  #cnt{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- search ---------- */
  #searchWrap{position:sticky;top:58px;z-index:19;
    padding:8px 12px;display:flex;gap:8px;background:rgba(7,7,13,.96);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  body.embedded #searchWrap{top:calc(102px + var(--safe-t))}
  #q{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--tx);
    border-radius:11px;padding:10px 12px;font:inherit;font-size:14px;outline:none}
  #q:focus{border-color:rgba(57,224,255,.5);box-shadow:0 0 0 3px rgba(57,224,255,.10)}
  #q::placeholder{color:#6d6d80}
  #qClear{display:none}

  /* ---------- grid ---------- */
  main{padding:12px 12px 4px}
  .sect{display:flex;align-items:center;gap:8px;margin:2px 2px 10px;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .sect:after{content:"";flex:1;height:1px;background:var(--line)}
  #recent{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  #recent::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;max-width:46vw;border:1px solid var(--line);background:var(--panel);
    color:var(--tx);border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip:active{transform:scale(.97)}

  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
  @media(min-width:760px){#grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}
  .card{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:var(--panel);cursor:pointer;transition:transform .12s ease,border-color .12s ease;
    display:flex;flex-direction:column}
  .card:hover{transform:translateY(-2px);border-color:rgba(57,224,255,.42)}
  .card:active{transform:scale(.985)}
  .thumb{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .thumb i{position:absolute;inset:0;background:
      radial-gradient(120% 90% at 18% 8%,rgba(255,255,255,.16),transparent 60%),
      linear-gradient(140deg,var(--c1),var(--c2))}
  .thumb span{position:relative;font-weight:800;font-size:26px;letter-spacing:.02em;
    color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
  @media(min-width:760px){.thumb span{font-size:34px}}
  .meta{padding:7px 9px 9px;min-height:44px;border-top:1px solid rgba(255,255,255,.05)}
  .name{font-size:12.5px;font-weight:600;line-height:1.25;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .sub{font-size:10.5px;color:var(--dim);margin-top:2px}
  #empty{display:none;padding:40px 16px;text-align:center;color:var(--dim)}
  #more{display:flex;justify-content:center;padding:16px 0 24px}
  #moreBtn{display:none}

  footer{padding:8px 14px 18px;color:#6a6a7c;font-size:11.5px;text-align:center;line-height:1.6}

  /* ---------- player ---------- */
  #player{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column}
  #player.on{display:flex}
  #pbar{display:flex;align-items:center;gap:8px;padding:calc(7px + var(--safe-t)) 10px 7px;
    background:#0b0b12;border-bottom:1px solid var(--line);flex:0 0 auto}
  body.embedded #pbar{padding-top:calc(51px + var(--safe-t))}
  #pname{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #pbar .btn{padding:7px 9px;font-size:13px}
  #pw{position:relative;flex:1 1 auto;background:#000}
  #pf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;transform-origin:0 0}
  #pload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;color:var(--dim);font-size:13px;background:#05050a;
    transition:opacity .25s ease;pointer-events:none}
  #pload.gone{opacity:0}
  .spin{width:26px;height:26px;border:2px solid #26263a;border-top-color:var(--acc);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #pfail{display:none;position:absolute;inset:0;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;color:var(--tx);background:#0a0a12;text-align:center;padding:24px}
  #pfail.on{display:flex}
  #pfail small{color:var(--dim);font-size:12px;line-height:1.6;max-width:34ch}
</style>
</head>
<body>
<header id="bar">
  <button class="btn ghost" id="btnBack" title="返回门户">← 门户</button>
  <div class="ttl"><b>小游戏大厅</b><span id="cnt">689 款</span></div>
  <button class="btn acc" id="btnRand">🎲 随机</button>
</header>

<div id="searchWrap">
  <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
         placeholder="搜索 689 款游戏…">
  <button class="btn ghost" id="qClear" title="清空">✕</button>
</div>

<main>
  <div id="recentWrap" style="display:none">
    <div class="sect">最近在玩</div>
    <div id="recent"></div>
  </div>
  <div class="sect" id="gridSect">全部游戏</div>
  <div id="grid"></div>
  <div id="empty">没有匹配的游戏 —— 换个关键词试试</div>
  <div id="more"><button class="btn" id="moreBtn">加载更多</button></div>
</main>

<footer>
  共 689 款网页小游戏 · 全部静态托管在本站<br>
  游戏来自开源项目 <a href="https://github.com/kunjgit/GameZone" target="_blank" rel="noopener">GameZone</a>（Apache-2.0）
</footer>

<div id="player">
  <div id="pbar">
    <button class="btn ghost" id="pBack">← 大厅</button>
    <span id="pname">—</span>
    <button class="btn" id="pFit" title="适配屏幕 / 原始尺寸">⤢ 适配</button>
    <button class="btn" id="pReload" title="重新加载">⟳</button>
    <button class="btn" id="pFs" title="全屏">⛶</button>
    <a class="btn" id="pOpen" target="_blank" rel="noopener" title="在新标签打开">↗</a>
  </div>
  <div id="pw">
    <iframe id="pf" allow="fullscreen; autoplay; gamepad; clipboard-write; accelerometer; gyroscope; encrypted-media"
            referrerpolicy="no-referrer"></iframe>
    <div id="pload"><div class="spin"></div><span>加载中…</span></div>
    <div id="pfail">
      <b>这个游戏没能加载</b>
      <small id="pfailMsg"></small>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="btn acc" id="pfRetry">再试一次</button>
        <a class="btn" id="pfNew" target="_blank" rel="noopener">新标签打开</a>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const embedded = window.top !== window.self;
  if (embedded) document.body.classList.add('embedded');

  const PAGE = 120;              // 首屏渲染数量，滚动时增量渲染（737 个 DOM 一次性也能扛，但手机上更顺）
  const LS_RECENT = 'arcadeRecentV1';
  let shown = PAGE, list = CATALOG.slice(), lastQ = '';

  /* 颜色由目录名哈希决定，保证同一个游戏永远是同一色 */
  function hue(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h%360; }
  function initials(name){
    const parts = name.replace(/[_\-.]+/g,' ').split(/\s+/).filter(Boolean);
    if(parts.length>=2) return (parts[0][0]+parts[1][0]).toUpperCase();
    const w = parts[0]||'?';
    if(/[\u4e00-\u9fa5]/.test(w)) return w.slice(0,2);
    return w.slice(0,2).toUpperCase();
  }
  function paint(card, g){
    const h = hue(g.d);
    card.querySelector('.thumb').style.setProperty('--c1', `hsl(${h} 72% 44%)`);
    card.querySelector('.thumb').style.setProperty('--c2', `hsl(${(h+48)%360} 68% 22%)`);
    card.querySelector('.thumb span').textContent = initials(g.n);
  }

  /* ---------- 渲染 ---------- */
  function makeCard(g){
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = '<div class="thumb"><i></i><span></span></div>'+
                   '<div class="meta"><div class="name"></div></div>';
    el.querySelector('.name').textContent = g.n;
    paint(el, g);
    el.onclick = () => openGame(g);
    return el;
  }
  function render(reset){
    const grid = $('#grid');
    if (reset){ grid.innerHTML=''; shown = PAGE; }
    const slice = list.slice(0, shown);
    const frag = document.createDocumentFragment();
    const from = reset ? 0 : grid.childElementCount;
    slice.slice(from).forEach(g => frag.appendChild(makeCard(g)));
    grid.appendChild(frag);
    $('#empty').style.display = list.length ? 'none' : 'block';
    $('#moreBtn').style.display = (shown < list.length) ? 'inline-flex' : 'none';
    updateCount();
  }
  function updateCount(){
    const c = $('#cnt');
    const q = lastQ.trim();
    c.textContent = q ? `${list.length} / ${CATALOG.length} 款`
                      : `${CATALOG.length} 款`;
  }
  function filter(q){
    lastQ = q;
    const needle = q.trim().toLowerCase();
    list = needle ? CATALOG.filter(g => g.n.toLowerCase().includes(needle) || g.d.toLowerCase().includes(needle))
                  : CATALOG.slice();
    render(true);
  }

  /* ---------- 最近在玩 ---------- */
  function getRecent(){
    try { return JSON.parse(localStorage.getItem(LS_RECENT)||'[]').filter(d=>CATALOG.some(g=>g.d===d)).slice(0,8); }
    catch(e){ return []; }
  }
  function pushRecent(d){
    try {
      let r = JSON.parse(localStorage.getItem(LS_RECENT)||'[]').filter(x=>x!==d);
      r.unshift(d); localStorage.setItem(LS_RECENT, JSON.stringify(r.slice(0,12)));
    } catch(e){}
  }
  function renderRecent(){
    const r = getRecent(), wrap = $('#recentWrap'), box = $('#recent');
    wrap.style.display = r.length ? 'block' : 'none';
    box.innerHTML = '';
    r.forEach(d => {
      const g = CATALOG.find(x=>x.d===d);
      const b = document.createElement('button');
      b.className='chip'; b.textContent = g.n;
      b.onclick = () => openGame(g);
      box.appendChild(b);
    });
  }

  /* ---------- 播放器 ---------- */
  let cur = null, loadTimer = null, alive = false;
  const player = $('#player'), pf = $('#pf');

  function gameUrl(g){ return encodeURIComponent(g.d) + '/index.html'; }

  function openGame(g, push){
    cur = g;
    updateUrl(g.d, push !== false);
    $('#pname').textContent = g.n;
    $('#pOpen').href = gameUrl(g);
    $('#pfNew').href = gameUrl(g);
    $('#pfail').classList.remove('on');
    resetFrame();
    player.classList.add('on');
    document.body.style.overflow = 'hidden';
    load(push !== false);
    pushRecent(g.d);
    renderRecent();
  }
  function load(){
    if (!cur) return;
    $('#pfail').classList.remove('on');
    const src = gameUrl(cur) + (gameUrl(cur).includes('?') ? '&' : '?') + '_r=' + Date.now();
    alive = false;
    $('#pload').classList.remove('gone');
    pf.src = src;
    clearTimeout(loadTimer);
    // iframe 的 onload 在 404 页面也会触发，所以只把它当「有响应」；超时才算失败
    loadTimer = setTimeout(() => { if (!alive) showFail('加载超时（网络慢或该游戏依赖外部资源）'); }, 12000);
  }
  pf.addEventListener('load', () => {
    alive = true;
    clearTimeout(loadTimer);
    setTimeout(()=>$('#pload').classList.add('gone'), 120);
    // 大量老游戏是 800x600 固定画布，手机上会被裁掉 —— 自动缩放到能看全
    setTimeout(fitFrame, 260); setTimeout(fitFrame, 1100);
  });

  /* ---------- 自适应缩放（把固定尺寸的游戏整体缩小塞进屏幕） ---------- */
  const LS_FIT = 'arcadeFitMode';
  let fitOn = (localStorage.getItem(LS_FIT) || '1') === '1';
  function fitLabel(){ $('#pFit').textContent = fitOn ? '⤢ 适配' : '⤢ 1:1'; }
  function resetFrame(){
    pf.style.transform = ''; pf.style.left=''; pf.style.top=''; pf.style.width=''; pf.style.height='';
  }
  function fitFrame(){
    fitLabel();
    if (!cur) return;
    // 量的是「容器」尺寸，不是 iframe 自己的盒子 —— 否则第二次测量会拿上一次缩放后的尺寸当基准，自我收敛成 1:1
    const box = pf.parentElement;
    const vw = (box && box.clientWidth) || 1, vh = (box && box.clientHeight) || 1;
    if (!fitOn) { resetFrame(); return; }
    resetFrame();                                  // 先还原成 100%，拿「原生尺寸」重新测
    let dw = 0, dh = 0;
    try {
      const d = pf.contentDocument;
      if (!d || !d.documentElement) return;
      dw = Math.max(d.documentElement.scrollWidth || 0, d.body ? d.body.scrollWidth : 0);
      dh = Math.max(d.documentElement.scrollHeight || 0, d.body ? d.body.scrollHeight : 0);
    } catch (e) { return; }                        // 跨域游戏不动
    if (!dw || !dh) return;
    const s = Math.min(1, vw / dw, vh / dh);
    if (s >= 0.995) return;                        // 本来就能装下
    pf.style.width = dw + 'px';
    pf.style.height = dh + 'px';
    pf.style.transform = 'scale(' + s.toFixed(4) + ')';
    pf.style.left = Math.max(0, (vw - dw * s) / 2) + 'px';
    pf.style.top = Math.max(0, (vh - dh * s) / 2) + 'px';
  }
  window.addEventListener('resize', () => setTimeout(fitFrame, 120));
  $('#pFit').onclick = () => {
    fitOn = !fitOn;
    try { localStorage.setItem(LS_FIT, fitOn ? '1' : '0'); } catch(e){}
    fitLabel();
    if (fitOn) fitFrame(); else resetFrame();
  };
  fitLabel();
  function showFail(msg){
    $('#pload').classList.add('gone');
    $('#pfailMsg').textContent = msg || '';
    $('#pfail').classList.add('on');
  }
  function closeGame(push){
    player.classList.remove('on');
    document.body.style.overflow = '';
    pf.src = 'about:blank';
    cur = null;
    if (push !== false) updateUrl(null, true);
  }
  function updateUrl(dir, push){
    const u = new URL(location.href);
    if (dir) u.searchParams.set('g', dir); else u.searchParams.delete('g');
    try { (push ? history.pushState : history.replaceState).call(history, {g: dir}, '', u); } catch(e){}
  }

  /* 返回门户：同源时直接调门户的 closeGame() */
  function backToPortal(){
    try { if (window.parent && window.parent !== window && typeof window.parent.closeGame === 'function'){ window.parent.closeGame(); return; } } catch(e){}
    location.href = '/';
  }

  /* ---------- 事件 ---------- */
  $('#q').addEventListener('input', e => {
    const v = e.target.value;
    $('#qClear').style.display = v ? 'inline-flex' : 'none';
    filter(v);
  });
  $('#qClear').onclick = () => { $('#q').value=''; $('#qClear').style.display='none'; filter(''); $('#q').focus(); };
  $('#moreBtn').onclick = () => { shown += PAGE; render(false); };
  $('#btnRand').onclick = () => {
    const pool = list.length ? list : CATALOG;
    if (!pool.length) return;
    openGame(pool[Math.floor(Math.random()*pool.length)]);
  };
  $('#btnBack').onclick = backToPortal;
  $('#pBack').onclick = () => closeGame();
  $('#pReload').onclick = () => load();
  $('#pfRetry').onclick = () => load();
  $('#pFs').onclick = () => {
    const el = $('#player');
    const on = document.fullscreenElement || document.webkitFullscreenElement;
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    const rq = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (on) { ex && ex.call(document); return; }
    if (!rq) { alert('iPhone Safari 不支持页内全屏：可点 ↗ 在新标签打开，或"添加到主屏幕"后从桌面图标进入。'); return; }
    const p = rq.call(el, {navigationUI:'hide'}); p && p.catch && p.catch(()=>{});
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && cur) { e.preventDefault(); closeGame(); }
    if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  });
  window.addEventListener('scroll', () => {
    if (shown >= list.length) return;
    if (window.innerHeight + window.scrollY > document.body.offsetHeight - 500) { shown += PAGE; render(false); }
  }, {passive:true});
  window.addEventListener('popstate', () => {
    const g = new URL(location.href).searchParams.get('g');
    if (!g && cur) closeGame(false);
    else if (g && (!cur || cur.d !== g)) { const hit = CATALOG.find(x=>x.d===g); if (hit) openGame(hit, false); }
  });

  /* ---------- 启动 ---------- */
  filter('');
  renderRecent();
  const deep = new URL(location.href).searchParams.get('g');
  if (deep){ const hit = CATALOG.find(x=>x.d===deep); if (hit) openGame(hit, false); }
  window.ARCADE = { count: CATALOG.length, open:(d)=>{const g=CATALOG.find(x=>x.d===d); if(g) openGame(g); return !!g;},
                    list:()=>list.map(g=>g.d), probe:()=>({count:CATALOG.length, shown:document.querySelectorAll('.card').length,
                    player:player.classList.contains('on'), cur:cur&&cur.d, embedded}) };
})();
